name: coderank-real-smoke

on:
  push:
    branches: ["analysis/coderank-real-smoke"]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: coderankembed-${{ runner.os }}-py312-v1
      - run: python -m pip install --upgrade pip
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install CodeRank dependencies
        run: python -m pip install -e ".[coderank]"
      - name: Run real CodeRank checkpoint smoke
        run: |
          python - <<'PY'
          import torch
          from cdm import CodeDecisionModel, CodeRankEncoder

          encoder = CodeRankEncoder(max_length=512, normalize_embeddings=True)
          assert encoder.dim > 0

          context = '''
          def parse_packet(data):
              header = __CALL_TARGET__(data)
              return decode_payload(data, header)
          '''
          candidates = [
              'def parse_header(data):\n    return data[:4]',
              'def decode_payload(data, header):\n    return data[4:]',
              'def dispatch(packet):\n    return packet.kind',
          ]

          q = encoder.encode_role([context], role='context')
          c = encoder.encode_role(candidates, role='candidate')
          assert q.shape == (1, encoder.dim)
          assert c.shape == (3, encoder.dim)
          assert torch.isfinite(q).all() and torch.isfinite(c).all()

          cosine = torch.mv(c, q[0])
          print('CODERANK_DIM=', encoder.dim)
          print('CODERANK_COSINE=', cosine.tolist())

          model = CodeDecisionModel(encoder=encoder, dim=encoder.dim, hidden=64)
          with torch.no_grad():
              p = model.probabilities(
                  context,
                  'Which candidate definition should replace __CALL_TARGET__?',
                  candidates,
              )
          assert p.shape == (3,)
          assert torch.isclose(p.sum(), torch.tensor(1.0), atol=1e-6)
          print('CODERANK_DECISION_PROBS=', p.tolist())
          PY
