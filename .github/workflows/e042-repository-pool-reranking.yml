name: e042-repository-pool-reranking

on:
  push:
    branches: ["analysis/e042-repository-pool-live"]

jobs:
  score:
    strategy:
      fail-fast: false
      matrix:
        heldout: [alphafold, pyodide, optuna, pytest]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: e025-qwen05-coderank-${{ runner.os }}-py312-v1
      - run: python -m pip install --upgrade pip
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install scorer dependencies
        run: python -m pip install -e ".[coderank]"
      - name: Clone exact E031 revisions
        run: |
          set -e
          clone_at () {
            url="$1"; sha="$2"; dest="$3"
            git clone --filter=blob:none --no-checkout "$url" "$dest"
            git -C "$dest" fetch --depth 1 origin "$sha"
            git -C "$dest" checkout --detach "$sha"
          }
          mkdir -p /tmp/e042-repos
          clone_at https://github.com/google-deepmind/alphafold.git c77e5d2a8961d1a353632c462914ff0a32a950f6 /tmp/e042-repos/alphafold
          clone_at https://github.com/pyodide/pyodide.git e4d3ae954d01d61a3e90531d63b881f2d33361b4 /tmp/e042-repos/pyodide
          clone_at https://github.com/optuna/optuna.git 7d08bfa1824606d7caedb80abfd8558bc63826d7 /tmp/e042-repos/optuna
          clone_at https://github.com/pytest-dev/pytest.git 6a9ba0f02f827a54cff6ab4da0dddecd65444ff6 /tmp/e042-repos/pytest
      - name: Run held-out repository-pool fold
        env:
          HELDOUT_REPO: ${{ matrix.heldout }}
        run: |
          python - <<'PY'
          import gc
          import json
          import os
          import statistics
          from collections import Counter
          from dataclasses import replace

          import torch

          from cdm import CodeDecisionModel, CodeRankEncoder, PairwiseMLPScorer
          from cdm.focus import focus_hard_call_context
          from cdm.methods import repository_hard_masked_method_call_examples
          from cdm.repository import (
              namespace_repository_examples,
              repository_hard_masked_call_examples,
          )
          from cdm.scope import (
              bindable_mask,
              in_scope_pools,
              pool_census,
              pool_example,
              render_symbol,
          )
          from cdm.training import collate_encoded_examples, preencode_examples

          REPOS = {
              "alphafold": "/tmp/e042-repos/alphafold",
              "pyodide": "/tmp/e042-repos/pyodide",
              "optuna": "/tmp/e042-repos/optuna",
              "pytest": "/tmp/e042-repos/pytest",
          }
          EXPECTED_EXTRACTION = {
              "alphafold": {"functions": 23, "methods": 3},
              "pyodide": {"functions": 34, "methods": 19},
              "optuna": {"functions": 79, "methods": 55},
              "pytest": {"functions": 86, "methods": 122},
          }
          EXPECTED_E031_TOP1 = {
              "alphafold": 11,
              "pyodide": 36,
              "optuna": 87,
              "pytest": 110,
          }
          EXPECTED_E041_TOP1 = {
              "alphafold": 7,
              "pyodide": 19,
              "optuna": 26,
              "pytest": 30,
          }

          HELDOUT = os.environ["HELDOUT_REPO"]
          K = 4
          BODY_CHARS = 512

          def repo_of(example):
              return example.source.split("::", 1)[0]

          raw_functions = {}
          raw_methods = {}
          pooled = []
          extraction = {}
          for name, root in REPOS.items():
              funcs = repository_hard_masked_call_examples(
                  root, candidate_count=K, candidate_body_chars=BODY_CHARS, seed=0
              )
              methods = repository_hard_masked_method_call_examples(
                  root, candidate_count=K, candidate_body_chars=BODY_CHARS, seed=0
              )
              raw_functions[name] = funcs
              raw_methods[name] = methods
              extraction[name] = {"functions": len(funcs), "methods": len(methods)}
              pooled.extend(namespace_repository_examples(funcs, name))
              pooled.extend(namespace_repository_examples(methods, name))

          if extraction != EXPECTED_EXTRACTION:
              raise RuntimeError(f"E031 extraction drift: {extraction!r}")
          if len(pooled) != 421:
              raise RuntimeError(f"E031 total drift: {len(pooled)} != 421")

          # Freeze both E041 continuity population and E042 repository population
          # before constructing the encoder/scorer.
          scope = in_scope_pools(REPOS[HELDOUT])
          scope_examples = []
          repository_examples = []
          repository_population = []
          repository_exclusions = []

          for index, raw in enumerate(raw_functions[HELDOUT]):
              focused = focus_hard_call_context(raw, radius_lines=0)

              # Exact E041 scope-population integrity path.
              census = pool_census(raw, scope, body_chars=BODY_CHARS)
              if census is None:
                  raise RuntimeError(f"missing caller scope at {HELDOUT}:{raw.source}")
              if not census.target_in_scope or not census.target_bindable_in_scope:
                  raise RuntimeError(
                      f"E041 continuity integrity failure target absent/vetoed: "
                      f"{HELDOUT}:{raw.source}"
                  )
              if not census.target_unique_in_scope:
                  raise RuntimeError(
                      f"E041 continuity ambiguity drift: {HELDOUT}:{raw.source}"
                  )
              scope_posed = pool_example(
                  raw, scope, level="scope", candidate_count=None,
                  body_chars=BODY_CHARS
              )
              if scope_posed is None:
                  raise RuntimeError(
                      f"E041 scope construction failed: {HELDOUT}:{raw.source}"
                  )
              scope_posed = replace(scope_posed, context=focused.context)
              if len(scope_posed.candidates) != census.scope_bindable:
                  raise RuntimeError(
                      f"E041 scope-size drift {len(scope_posed.candidates)} "
                      f"!= {census.scope_bindable}"
                  )
              scope_examples.append(scope_posed)

              # E042 repository population. Distinguish hard target veto from
              # rendering ambiguity before any model object exists.
              repo_symbols = scope.repository_pool(raw)
              wanted = raw.candidates[raw.answer_index]
              all_rendered = [
                  render_symbol(symbol, body_chars=BODY_CHARS)
                  for symbol in repo_symbols
              ]
              if wanted not in all_rendered:
                  raise RuntimeError(
                      f"E042 integrity failure target absent: {HELDOUT}:{raw.source}"
                  )

              mask = bindable_mask(raw, repo_symbols, body_chars=BODY_CHARS)
              bindable_symbols = [
                  symbol for symbol, allowed in zip(repo_symbols, mask) if allowed
              ]
              bindable_rendered = [
                  render_symbol(symbol, body_chars=BODY_CHARS)
                  for symbol in bindable_symbols
              ]
              target_bindable_count = sum(text == wanted for text in bindable_rendered)
              if target_bindable_count == 0:
                  raise RuntimeError(
                      f"E042 integrity failure target vetoed by E024: "
                      f"{HELDOUT}:{raw.source}"
                  )
              if target_bindable_count > 1:
                  repository_exclusions.append({
                      "source_index": index,
                      "source": raw.source,
                      "reason": "ambiguous_target_rendering",
                      "matching_bindable_renderings": target_bindable_count,
                  })
                  continue

              repository_posed = pool_example(
                  raw, scope, level="repository", candidate_count=None,
                  body_chars=BODY_CHARS
              )
              if repository_posed is None:
                  raise RuntimeError(
                      f"E042 repository construction failed after integrity guards: "
                      f"{HELDOUT}:{raw.source}"
                  )
              repository_posed = replace(repository_posed, context=focused.context)
              distinct_bindable = len(set(bindable_rendered))
              if len(repository_posed.candidates) != distinct_bindable:
                  raise RuntimeError(
                      f"E042 repository pool-size drift "
                      f"{len(repository_posed.candidates)} != {distinct_bindable}"
                  )
              repository_examples.append(repository_posed)
              repository_population.append({
                  "source_index": index,
                  "source": raw.source,
                  "pool_size": len(repository_posed.candidates),
              })

          if len(scope_examples) != EXPECTED_EXTRACTION[HELDOUT]["functions"]:
              raise RuntimeError(
                  f"E041 continuity population drift: {len(scope_examples)}"
              )
          if (
              len(repository_examples) + len(repository_exclusions)
              != EXPECTED_EXTRACTION[HELDOUT]["functions"]
          ):
              raise RuntimeError("E042 repository population accounting drift")
          if not repository_examples:
              raise RuntimeError("E042 repository population is empty")

          train_examples = [e for e in pooled if repo_of(e) != HELDOUT]
          original_test = [e for e in pooled if repo_of(e) == HELDOUT]
          train_focus = [
              focus_hard_call_context(e, radius_lines=0) for e in train_examples
          ]
          test_focus = [
              focus_hard_call_context(e, radius_lines=0) for e in original_test
          ]

          # One shared frozen-encoder cache across training, E031 guard, E041
          # continuity, and E042 repository candidates.
          encoder = CodeRankEncoder(max_length=512, normalize_embeddings=False)
          shell = CodeDecisionModel(
              encoder=encoder,
              dim=encoder.dim,
              scorer=PairwiseMLPScorer(encoder.dim, hidden=32),
          )
          all_for_encoding = [
              *train_focus,
              *test_focus,
              *scope_examples,
              *repository_examples,
          ]
          encoded = preencode_examples(
              shell, all_for_encoding, batch_size=8, store_device="cpu"
          )
          n_train = len(train_focus)
          n_test = len(test_focus)
          n_scope = len(scope_examples)
          encoded_train = encoded[:n_train]
          encoded_test = encoded[n_train:n_train + n_test]
          encoded_scope = encoded[n_train + n_test:n_train + n_test + n_scope]
          encoded_repository = encoded[n_train + n_test + n_scope:]

          # Reproduce exact E031 training and full-test guard.
          torch.manual_seed(2)
          shell.scorer = PairwiseMLPScorer(encoder.dim, hidden=32)
          optimizer = torch.optim.AdamW(
              shell.scorer.parameters(), lr=1e-3, weight_decay=1e-2
          )
          order = torch.randperm(
              len(encoded_train),
              generator=torch.Generator().manual_seed(20001),
          ).tolist()
          shell.scorer.train()
          for start in range(0, len(order), 32):
              ids = order[start:start + 32]
              batch = collate_encoded_examples([encoded_train[i] for i in ids])
              optimizer.zero_grad(set_to_none=True)
              logits = shell.score_encoded_batch(
                  batch.contexts, batch.questions, batch.candidate_embeddings
              )
              loss = torch.nn.functional.cross_entropy(logits, batch.targets)
              loss.backward()
              torch.nn.utils.clip_grad_norm_(shell.scorer.parameters(), 1.0)
              optimizer.step()

          shell.scorer.eval()
          with torch.no_grad():
              original_predictions = [
                  int(shell.score_encoded(
                      item.decision_context, item.candidate_embeddings
                  ).argmax())
                  for item in encoded_test
              ]
          original_correct = sum(
              pred == example.answer_index
              for pred, example in zip(original_predictions, original_test)
          )
          if original_correct != EXPECTED_E031_TOP1[HELDOUT]:
              raise RuntimeError(
                  f"E031 scorer reproduction drift for {HELDOUT}: "
                  f"{original_correct} != {EXPECTED_E031_TOP1[HELDOUT]}"
              )

          original_function_rows = [
              (pred, example)
              for pred, example in zip(original_predictions, original_test)
              if "same_class" not in example.task
          ]
          original_function_correct = sum(
              pred == example.answer_index
              for pred, example in original_function_rows
          )

          # Exact E041 continuity guard with the same scorer.
          with torch.no_grad():
              scope_predictions = [
                  int(shell.score_encoded(
                      item.decision_context, item.candidate_embeddings
                  ).argmax())
                  for item in encoded_scope
              ]
          scope_correct = sum(
              pred == example.answer_index
              for pred, example in zip(scope_predictions, scope_examples)
          )
          if scope_correct != EXPECTED_E041_TOP1[HELDOUT]:
              raise RuntimeError(
                  f"E041 scope reproduction drift for {HELDOUT}: "
                  f"{scope_correct} != {EXPECTED_E041_TOP1[HELDOUT]}"
              )

          # E042 outcomes are interpreted only after both continuity guards pass.
          records = []
          with torch.no_grad():
              for meta, example, item in zip(
                  repository_population, repository_examples, encoded_repository
              ):
                  logits = shell.score_encoded(
                      item.decision_context, item.candidate_embeddings
                  )
                  scores = [float(v) for v in logits.detach().cpu()]
                  ranked = sorted(range(len(scores)), key=lambda i: (-scores[i], i))
                  rank = ranked.index(example.answer_index) + 1
                  pred = ranked[0]
                  records.append({
                      "repo": HELDOUT,
                      "source_index": meta["source_index"],
                      "source": meta["source"],
                      "pool_size": meta["pool_size"],
                      "answer_index": example.answer_index,
                      "prediction_index": pred,
                      "correct": pred == example.answer_index,
                      "uniform_expectation": 1.0 / meta["pool_size"],
                      "excess": (
                          float(pred == example.answer_index)
                          - 1.0 / meta["pool_size"]
                      ),
                      "target_rank": rank,
                  })

          def bin_name(n):
              if 2 <= n <= 4:
                  return "2-4"
              if 5 <= n <= 16:
                  return "5-16"
              if 17 <= n <= 64:
                  return "17-64"
              if 65 <= n <= 256:
                  return "65-256"
              if n > 256:
                  return ">256"
              return None

          by_bin = {}
          for label in ("2-4", "5-16", "17-64", "65-256", ">256"):
              rows = [r for r in records if bin_name(r["pool_size"]) == label]
              by_bin[label] = {
                  "n": len(rows),
                  "top1": sum(r["correct"] for r in rows),
                  "top1_rate": (
                      sum(r["correct"] for r in rows) / len(rows)
                      if rows else None
                  ),
                  "uniform_expected_successes": sum(
                      r["uniform_expectation"] for r in rows
                  ),
              }

          def topk(k):
              eligible = [r for r in records if r["pool_size"] >= k]
              return {
                  "eligible": len(eligible),
                  "hits": sum(r["target_rank"] <= k for r in eligible),
                  "rate": (
                      sum(r["target_rank"] <= k for r in eligible) / len(eligible)
                      if eligible else None
                  ),
              }

          sizes = [r["pool_size"] for r in records]
          summary = {
              "heldout_repo": HELDOUT,
              "source_function_tasks": len(raw_functions[HELDOUT]),
              "repository_tasks": len(records),
              "ambiguity_exclusions": repository_exclusions,
              "e031_guard": {
                  "all_test_tasks": len(original_test),
                  "top1_correct": original_correct,
                  "expected_top1_correct": EXPECTED_E031_TOP1[HELDOUT],
                  "function_tasks": len(original_function_rows),
                  "function_top1_correct": original_function_correct,
              },
              "e041_guard": {
                  "scope_tasks": len(scope_examples),
                  "top1_correct": scope_correct,
                  "expected_top1_correct": EXPECTED_E041_TOP1[HELDOUT],
              },
              "pool": {
                  "min": min(sizes),
                  "max": max(sizes),
                  "mean": statistics.mean(sizes),
                  "median": statistics.median(sizes),
                  "size_one_tasks": sum(n == 1 for n in sizes),
                  "by_size_bin": by_bin,
              },
              "top1_successes": sum(r["correct"] for r in records),
              "top1_rate": sum(r["correct"] for r in records) / len(records),
              "uniform_expected_successes": sum(
                  r["uniform_expectation"] for r in records
              ),
              "mean_excess": statistics.mean(r["excess"] for r in records),
              "mean_reciprocal_rank": statistics.mean(
                  1.0 / r["target_rank"] for r in records
              ),
              "top3": topk(3),
              "top5": topk(5),
              "top10": topk(10),
              "top20": topk(20),
              "top50": topk(50),
              "target_rank_histogram": dict(sorted(Counter(
                  r["target_rank"] for r in records
              ).items())),
              "extraction": extraction,
          }

          path = f"/tmp/e042-{HELDOUT}.json"
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(
                  {"summary": summary, "records": records},
                  handle, indent=2, sort_keys=True
              )
          print("E042_FOLD=" + json.dumps(summary, sort_keys=True))

          del encoded, encoded_train, encoded_test, encoded_scope
          del encoded_repository, shell, encoder, optimizer
          gc.collect()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: e042-${{ matrix.heldout }}
          path: /tmp/e042-${{ matrix.heldout }}.json

  aggregate:
    needs: score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: e042-*
          path: /tmp/e042
          merge-multiple: true
      - name: Aggregate repository-pool folds
        run: |
          python - <<'PY'
          import glob
          import json
          import math
          import random
          import statistics
          from collections import Counter, defaultdict

          BOOTSTRAPS = 5000
          SEED = 42042
          EXPECTED_SOURCE = {
              "alphafold": 23,
              "pyodide": 34,
              "optuna": 79,
              "pytest": 86,
          }
          EXPECTED_E031 = {
              "alphafold": 11,
              "pyodide": 36,
              "optuna": 87,
              "pytest": 110,
          }
          EXPECTED_E041 = {
              "alphafold": 7,
              "pyodide": 19,
              "optuna": 26,
              "pytest": 30,
          }

          folds = []
          records = []
          exclusions = []
          for path in sorted(glob.glob("/tmp/e042/e042-*.json")):
              with open(path, encoding="utf-8") as handle:
                  payload = json.load(handle)
              folds.append(payload["summary"])
              records.extend(payload["records"])
              exclusions.extend(
                  {"repo": payload["summary"]["heldout_repo"], **row}
                  for row in payload["summary"]["ambiguity_exclusions"]
              )

          if len(folds) != 4:
              raise RuntimeError(f"expected four E042 folds, got {len(folds)}")
          source_counts = {
              f["heldout_repo"]: f["source_function_tasks"] for f in folds
          }
          if source_counts != EXPECTED_SOURCE:
              raise RuntimeError(f"E042 source-count drift: {source_counts!r}")
          for fold in folds:
              repo = fold["heldout_repo"]
              if fold["e031_guard"]["top1_correct"] != EXPECTED_E031[repo]:
                  raise RuntimeError(f"E031 aggregate guard drift for {repo}")
              if fold["e041_guard"]["top1_correct"] != EXPECTED_E041[repo]:
                  raise RuntimeError(f"E041 aggregate guard drift for {repo}")
          if len(records) + len(exclusions) != 222:
              raise RuntimeError(
                  f"E042 population accounting drift: "
                  f"{len(records)} + {len(exclusions)} != 222"
              )
          if not records:
              raise RuntimeError("E042 aggregate has no primary tasks")

          groups = defaultdict(lambda: defaultdict(list))
          for r in records:
              groups[r["repo"]][r["source"]].append(r)

          rng = random.Random(SEED)
          boots = []
          for _ in range(BOOTSTRAPS):
              sample = []
              for repo in sorted(groups):
                  sources = sorted(groups[repo])
                  for _ in range(len(sources)):
                      source = rng.choice(sources)
                      sample.extend(groups[repo][source])
              boots.append(statistics.mean(r["excess"] for r in sample))

          def percentile(values, q):
              xs = sorted(values)
              pos = (len(xs) - 1) * q
              lo = int(math.floor(pos))
              hi = int(math.ceil(pos))
              if lo == hi:
                  return xs[lo]
              w = pos - lo
              return xs[lo] * (1 - w) + xs[hi] * w

          ci = [percentile(boots, .025), percentile(boots, .975)]
          successes = sum(r["correct"] for r in records)
          expected = sum(r["uniform_expectation"] for r in records)
          mean_excess = statistics.mean(r["excess"] for r in records)

          def bin_name(n):
              if 2 <= n <= 4:
                  return "2-4"
              if 5 <= n <= 16:
                  return "5-16"
              if 17 <= n <= 64:
                  return "17-64"
              if 65 <= n <= 256:
                  return "65-256"
              if n > 256:
                  return ">256"
              return None

          by_bin = {}
          for label in ("2-4", "5-16", "17-64", "65-256", ">256"):
              rows = [r for r in records if bin_name(r["pool_size"]) == label]
              by_bin[label] = {
                  "n": len(rows),
                  "top1": sum(r["correct"] for r in rows),
                  "top1_rate": (
                      sum(r["correct"] for r in rows) / len(rows)
                      if rows else None
                  ),
                  "uniform_expected_successes": sum(
                      r["uniform_expectation"] for r in rows
                  ),
              }

          def topk(k):
              eligible = [r for r in records if r["pool_size"] >= k]
              return {
                  "eligible": len(eligible),
                  "hits": sum(r["target_rank"] <= k for r in eligible),
                  "rate": (
                      sum(r["target_rank"] <= k for r in eligible) / len(eligible)
                      if eligible else None
                  ),
              }

          per_repo = {}
          for repo in sorted(groups):
              rows = [r for r in records if r["repo"] == repo]
              per_repo[repo] = {
                  "n": len(rows),
                  "top1": sum(r["correct"] for r in rows),
                  "uniform_expected_successes": sum(
                      r["uniform_expectation"] for r in rows
                  ),
                  "mean_excess": statistics.mean(r["excess"] for r in rows),
                  "mean_pool_size": statistics.mean(r["pool_size"] for r in rows),
                  "median_pool_size": statistics.median(r["pool_size"] for r in rows),
                  "e031_function_top1": next(
                      f["e031_guard"]["function_top1_correct"]
                      for f in folds if f["heldout_repo"] == repo
                  ),
                  "e041_scope_top1": next(
                      f["e041_guard"]["top1_correct"]
                      for f in folds if f["heldout_repo"] == repo
                  ),
              }

          sizes = [r["pool_size"] for r in records]
          report = {
              "protocol": (
                  "E042 scorer-only complete E024-bindable "
                  "repository-pool reranking"
              ),
              "source_function_tasks": 222,
              "repository_tasks": len(records),
              "ambiguity_exclusions": exclusions,
              "retained_fraction": len(records) / 222,
              "top1_successes": successes,
              "top1_rate": successes / len(records),
              "uniform_expected_successes": expected,
              "uniform_expected_rate": expected / len(records),
              "mean_excess": mean_excess,
              "cluster_bootstrap_95ci_mean_excess": ci,
              "bootstrap_replicates": BOOTSTRAPS,
              "bootstrap_seed": SEED,
              "pool": {
                  "min": min(sizes),
                  "max": max(sizes),
                  "mean": statistics.mean(sizes),
                  "median": statistics.median(sizes),
                  "size_one_tasks": sum(n == 1 for n in sizes),
                  "by_size_bin": by_bin,
              },
              "mean_reciprocal_rank": statistics.mean(
                  1.0 / r["target_rank"] for r in records
              ),
              "top3": topk(3),
              "top5": topk(5),
              "top10": topk(10),
              "top20": topk(20),
              "top50": topk(50),
              "target_rank_histogram": dict(sorted(Counter(
                  r["target_rank"] for r in records
              ).items())),
              "per_repo": per_repo,
              "folds": sorted(folds, key=lambda f: f["heldout_repo"]),
          }
          report["primary_gate"] = {
              "observed_successes_gt_uniform_expectation": successes > expected,
              "cluster_lower_gt_zero": ci[0] > 0.0,
          }
          report["primary_gate"]["passed"] = all(
              report["primary_gate"].values()
          )

          with open("/tmp/e042-aggregate.json", "w", encoding="utf-8") as handle:
              json.dump(
                  {"summary": report, "records": records},
                  handle, indent=2, sort_keys=True
              )
          print("E042_AGGREGATE=" + json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: e042-aggregate
          path: /tmp/e042-aggregate.json
