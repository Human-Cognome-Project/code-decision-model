name: e031-independent-replication

on:
  push:
    branches: ["analysis/e031-independent-replication-live"]

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        heldout: [alphafold, pyodide, optuna, pytest]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: e025-qwen05-coderank-${{ runner.os }}-py312-v1
      - run: python -m pip install --upgrade pip
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install model dependencies
        run: python -m pip install -e ".[hf,coderank]"
      - name: Clone exact benchmark revisions
        run: |
          set -e
          clone_at () {
            url="$1"
            sha="$2"
            dest="$3"
            git clone --filter=blob:none --no-checkout "$url" "$dest"
            git -C "$dest" fetch --depth 1 origin "$sha"
            git -C "$dest" checkout --detach "$sha"
          }
          mkdir -p /tmp/e031-repos
          clone_at https://github.com/google-deepmind/alphafold.git c77e5d2a8961d1a353632c462914ff0a32a950f6 /tmp/e031-repos/alphafold
          clone_at https://github.com/pyodide/pyodide.git e4d3ae954d01d61a3e90531d63b881f2d33361b4 /tmp/e031-repos/pyodide
          clone_at https://github.com/optuna/optuna.git 7d08bfa1824606d7caedb80abfd8558bc63826d7 /tmp/e031-repos/optuna
          clone_at https://github.com/pytest-dev/pytest.git 6a9ba0f02f827a54cff6ab4da0dddecd65444ff6 /tmp/e031-repos/pytest
      - name: Run repository-held-out fold
        env:
          HELDOUT_REPO: ${{ matrix.heldout }}
        run: |
          python - <<'PY'
          import gc
          import json
          import math
          import os
          import re
          import statistics
          import time
          from collections import Counter

          import torch
          from transformers import AutoModelForCausalLM, AutoTokenizer

          from cdm import CodeDecisionModel, CodeRankEncoder, PairwiseMLPScorer
          from cdm.focus import focus_hard_call_context
          from cdm.methods import repository_hard_masked_method_call_examples
          from cdm.repository import (
              namespace_repository_examples,
              repository_hard_masked_call_examples,
          )
          from cdm.training import collate_encoded_examples, preencode_examples

          REPOS = {
              "alphafold": "/tmp/e031-repos/alphafold",
              "pyodide": "/tmp/e031-repos/pyodide",
              "optuna": "/tmp/e031-repos/optuna",
              "pytest": "/tmp/e031-repos/pytest",
          }
          HELDOUT = os.environ["HELDOUT_REPO"]
          MODEL_ID = "Qwen/Qwen2.5-Coder-0.5B-Instruct"
          MODEL_REVISION = "ea3f2471cf1b1f0db85067f1ef93848e38e88c25"
          K = 4
          BODY_CHARS = 512
          MAX_ATTEMPTS = 2

          def repo_of(example):
              return example.source.split("::", 1)[0]

          def task_kind(example):
              return "method" if "same_class" in example.task else "function"

          pooled = []
          extraction = {}
          for name, root in REPOS.items():
              funcs = repository_hard_masked_call_examples(
                  root,
                  candidate_count=K,
                  candidate_body_chars=BODY_CHARS,
                  seed=0,
              )
              methods = repository_hard_masked_method_call_examples(
                  root,
                  candidate_count=K,
                  candidate_body_chars=BODY_CHARS,
                  seed=0,
              )
              extraction[name] = {
                  "functions": len(funcs),
                  "methods": len(methods),
              }
              pooled.extend(namespace_repository_examples(funcs, name))
              pooled.extend(namespace_repository_examples(methods, name))

          expected_extraction = {
              "alphafold": {"functions": 23, "methods": 3},
              "pyodide": {"functions": 34, "methods": 19},
              "optuna": {"functions": 79, "methods": 55},
              "pytest": {"functions": 86, "methods": 122},
          }
          if extraction != expected_extraction:
              raise RuntimeError(
                  f"E031 extraction drift: {extraction!r} != {expected_extraction!r}"
              )
          if len(pooled) != 421:
              raise RuntimeError(f"E031 task-count drift: {len(pooled)} != 421")

          train_examples = [e for e in pooled if repo_of(e) != HELDOUT]
          test_examples = [e for e in pooled if repo_of(e) == HELDOUT]
          if not train_examples or not test_examples:
              raise RuntimeError("leave-one-repository-out fold is empty")

          train_focus = [focus_hard_call_context(e, radius_lines=0) for e in train_examples]
          test_focus = [focus_hard_call_context(e, radius_lines=0) for e in test_examples]

          encoder = CodeRankEncoder(max_length=512, normalize_embeddings=False)
          shell = CodeDecisionModel(
              encoder=encoder,
              dim=encoder.dim,
              scorer=PairwiseMLPScorer(encoder.dim, hidden=32),
          )
          encoded = preencode_examples(
              shell,
              [*train_focus, *test_focus],
              batch_size=8,
          )
          n_train = len(train_focus)
          encoded_train = encoded[:n_train]
          encoded_test = encoded[n_train:]

          torch.manual_seed(2)
          shell.scorer = PairwiseMLPScorer(encoder.dim, hidden=32)
          optimizer = torch.optim.AdamW(
              shell.scorer.parameters(),
              lr=1e-3,
              weight_decay=1e-2,
          )
          order = torch.randperm(
              len(encoded_train),
              generator=torch.Generator().manual_seed(20001),
          ).tolist()
          shell.scorer.train()
          for start in range(0, len(order), 32):
              ids = order[start:start + 32]
              batch = collate_encoded_examples([encoded_train[i] for i in ids])
              optimizer.zero_grad(set_to_none=True)
              logits = shell.score_encoded_batch(
                  batch.contexts,
                  batch.questions,
                  batch.candidate_embeddings,
              )
              loss = torch.nn.functional.cross_entropy(logits, batch.targets)
              loss.backward()
              torch.nn.utils.clip_grad_norm_(shell.scorer.parameters(), 1.0)
              optimizer.step()

          shell.scorer.eval()
          recommendations = []
          with torch.no_grad():
              for item in encoded_test:
                  recommendations.append(
                      int(
                          shell.score_encoded(
                              item.decision_context,
                              item.candidate_embeddings,
                          ).argmax()
                      )
                  )

          decision_accuracy = sum(
              pred == example.answer_index
              for pred, example in zip(recommendations, test_examples)
          ) / len(test_examples)

          del encoded_train, encoded_test, encoded, shell, encoder, optimizer
          gc.collect()

          tokenizer = AutoTokenizer.from_pretrained(
              MODEL_ID,
              revision=MODEL_REVISION,
          )
          model = AutoModelForCausalLM.from_pretrained(
              MODEL_ID,
              revision=MODEL_REVISION,
              torch_dtype=torch.float32,
          )
          model.eval()

          def prompt_for(example, recommendation, feedback):
              blocks = [
                  "Choose the one candidate that should replace __CALL_TARGET__.",
                  "Return only one digit: 1, 2, 3, or 4. Do not return code or explanation.",
                  "Caller:\n" + example.context,
              ]
              for i, candidate in enumerate(example.candidates):
                  blocks.append(f"Candidate {i + 1}:\n{candidate}")
              if recommendation is not None:
                  blocks.append(
                      "Repository decision evidence (fallible): "
                      f"candidate {recommendation + 1} is recommended."
                  )
              if feedback:
                  blocks.append(feedback)
              return "\n\n".join(blocks)

          choice_re = re.compile(
              r"^(?:candidate\s*)?([1-4])(?:[.)]?)$",
              re.IGNORECASE,
          )

          def generate_choice(prompt):
              messages = [
                  {
                      "role": "system",
                      "content": (
                          "You are a precise code decision engine. "
                          "Answer only with the requested candidate digit."
                      ),
                  },
                  {"role": "user", "content": prompt},
              ]
              rendered = tokenizer.apply_chat_template(
                  messages,
                  tokenize=False,
                  add_generation_prompt=True,
              )
              inputs = tokenizer(rendered, return_tensors="pt")
              t0 = time.perf_counter()
              with torch.inference_mode():
                  output = model.generate(
                      **inputs,
                      max_new_tokens=8,
                      do_sample=False,
                      num_beams=1,
                      pad_token_id=tokenizer.eos_token_id,
                      eos_token_id=tokenizer.eos_token_id,
                  )
              seconds = time.perf_counter() - t0
              generated = output[0, inputs["input_ids"].shape[-1]:]
              text = tokenizer.decode(generated, skip_special_tokens=True).strip()
              return text, seconds

          def run_arm(example, recommendation):
              attempts = []
              feedback = None
              for _ in range(MAX_ATTEMPTS):
                  raw, seconds = generate_choice(
                      prompt_for(example, recommendation, feedback)
                  )
                  match = choice_re.fullmatch(raw.strip())
                  if match is None:
                      attempts.append({
                          "raw": raw,
                          "parsed": None,
                          "correct": False,
                          "reason": "invalid_choice_format",
                          "seconds": seconds,
                      })
                      feedback = "Invalid format. Return only one digit: 1, 2, 3, or 4."
                      continue

                  choice = int(match.group(1)) - 1
                  correct = choice == example.answer_index
                  attempts.append({
                      "raw": raw,
                      "parsed": choice,
                      "correct": correct,
                      "reason": "ok" if correct else "wrong_target",
                      "seconds": seconds,
                  })
                  if correct:
                      break
                  feedback = (
                      "That candidate violates the repository constraint. "
                      "Choose another candidate number."
                  )

              return {
                  "success": bool(attempts and attempts[-1]["correct"]),
                  "attempts": len(attempts),
                  "correction_turns": max(0, len(attempts) - 1),
                  "first_pass": bool(attempts and attempts[0]["correct"]),
                  "trace": attempts,
              }

          records = []
          for example, recommendation in zip(test_examples, recommendations):
              baseline = run_arm(example, None)
              assisted = run_arm(example, recommendation)
              records.append({
                  "repo": HELDOUT,
                  "task": task_kind(example),
                  "source": example.source,
                  "answer_index": example.answer_index,
                  "recommendation_index": recommendation,
                  "recommendation_correct": recommendation == example.answer_index,
                  "baseline": baseline,
                  "assisted": assisted,
              })

          def condition_summary(name):
              rows = [r[name] for r in records]
              successes = [r for r in rows if r["success"]]
              return {
                  "n": len(rows),
                  "successes": sum(r["success"] for r in rows),
                  "success_rate": sum(r["success"] for r in rows) / len(rows),
                  "first_pass_successes": sum(r["first_pass"] for r in rows),
                  "first_pass_rate": sum(r["first_pass"] for r in rows) / len(rows),
                  "terminal_failures": sum(not r["success"] for r in rows),
                  "mean_attempts_all": statistics.mean(r["attempts"] for r in rows),
                  "mean_corrections_successful": (
                      statistics.mean(r["correction_turns"] for r in successes)
                      if successes else None
                  ),
                  "invalid_format_attempts": sum(
                      a["reason"] == "invalid_choice_format"
                      for r in rows for a in r["trace"]
                  ),
                  "generation_seconds": sum(
                      a["seconds"] for r in rows for a in r["trace"]
                  ),
              }

          def two_sided_binomial(k, n):
              if n == 0:
                  return 1.0
              low = min(k, n - k)
              tail = sum(math.comb(n, i) for i in range(low + 1)) / (2 ** n)
              return min(1.0, 2.0 * tail)

          both = [
              r for r in records
              if r["baseline"]["success"] and r["assisted"]["success"]
          ]
          deltas = [
              r["baseline"]["correction_turns"] - r["assisted"]["correction_turns"]
              for r in both
          ]
          assisted_only = sum(
              r["assisted"]["success"] and not r["baseline"]["success"]
              for r in records
          )
          baseline_only = sum(
              r["baseline"]["success"] and not r["assisted"]["success"]
              for r in records
          )

          summary = {
              "heldout_repo": HELDOUT,
              "model": MODEL_ID,
              "revision": MODEL_REVISION,
              "train_examples": len(train_examples),
              "test_examples": len(test_examples),
              "test_by_task": dict(Counter(task_kind(e) for e in test_examples)),
              "decision_accuracy": decision_accuracy,
              "baseline": condition_summary("baseline"),
              "assisted": condition_summary("assisted"),
              "paired": {
                  "both_success": len(both),
                  "assisted_only": assisted_only,
                  "baseline_only": baseline_only,
                  "neither": sum(
                      not r["baseline"]["success"] and not r["assisted"]["success"]
                      for r in records
                  ),
                  "success_rate_delta": (
                      sum(r["assisted"]["success"] for r in records)
                      - sum(r["baseline"]["success"] for r in records)
                  ) / len(records),
                  "first_pass_rate_delta": (
                      sum(r["assisted"]["first_pass"] for r in records)
                      - sum(r["baseline"]["first_pass"] for r in records)
                  ) / len(records),
                  "mcnemar_exact_two_sided_p": two_sided_binomial(
                      assisted_only,
                      assisted_only + baseline_only,
                  ),
                  "mean_correction_turn_delta_both_success": (
                      statistics.mean(deltas) if deltas else None
                  ),
                  "fewer_corrections_assisted": sum(d > 0 for d in deltas),
                  "same_corrections": sum(d == 0 for d in deltas),
                  "more_corrections_assisted": sum(d < 0 for d in deltas),
                  "sign_exact_two_sided_p": two_sided_binomial(
                      sum(d > 0 for d in deltas),
                      sum(d != 0 for d in deltas),
                  ),
              },
              "extraction": extraction,
          }

          path = f"/tmp/e031-{HELDOUT}.json"
          with open(path, "w", encoding="utf-8") as handle:
              json.dump({"summary": summary, "records": records}, handle, indent=2, sort_keys=True)
          print("E031_FOLD_JSON=" + json.dumps(summary, sort_keys=True))
          PY
      - name: Upload fold records
        uses: actions/upload-artifact@v4
        with:
          name: e031-${{ matrix.heldout }}
          path: /tmp/e031-${{ matrix.heldout }}.json

  aggregate:
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: e031-*
          path: /tmp/e031
          merge-multiple: true
      - name: Aggregate repository-held-out folds
        run: |
          python - <<'PY'
          import glob
          import json
          import math
          import random
          import statistics
          from collections import defaultdict

          BOOTSTRAPS = 5000
          folds = []
          records = []
          for path in sorted(glob.glob("/tmp/e031/e031-*.json")):
              with open(path, encoding="utf-8") as handle:
                  payload = json.load(handle)
              folds.append(payload["summary"])
              records.extend(payload["records"])

          if len(folds) != 4:
              raise RuntimeError(f"expected four folds, got {len(folds)}")
          if len(records) != 421:
              raise RuntimeError(f"expected 421 E031 tasks, got {len(records)}")

          def two_sided_binomial(k, n):
              if n == 0:
                  return 1.0
              low = min(k, n - k)
              tail = sum(math.comb(n, i) for i in range(low + 1)) / (2 ** n)
              return min(1.0, 2.0 * tail)

          def condition(name):
              rows = [r[name] for r in records]
              successes = [r for r in rows if r["success"]]
              return {
                  "n": len(rows),
                  "successes": sum(r["success"] for r in rows),
                  "success_rate": sum(r["success"] for r in rows) / len(rows),
                  "first_pass_successes": sum(r["first_pass"] for r in rows),
                  "first_pass_rate": sum(r["first_pass"] for r in rows) / len(rows),
                  "terminal_failures": sum(not r["success"] for r in rows),
                  "mean_attempts_all": statistics.mean(r["attempts"] for r in rows),
                  "mean_corrections_successful": (
                      statistics.mean(r["correction_turns"] for r in successes)
                      if successes else None
                  ),
                  "invalid_format_attempts": sum(
                      a["reason"] == "invalid_choice_format"
                      for r in rows for a in r["trace"]
                  ),
              }

          both = [
              r for r in records
              if r["baseline"]["success"] and r["assisted"]["success"]
          ]
          deltas = [
              r["baseline"]["correction_turns"] - r["assisted"]["correction_turns"]
              for r in both
          ]
          assisted_only = sum(
              r["assisted"]["success"] and not r["baseline"]["success"]
              for r in records
          )
          baseline_only = sum(
              r["baseline"]["success"] and not r["assisted"]["success"]
              for r in records
          )

          groups = defaultdict(lambda: defaultdict(list))
          for r in records:
              groups[r["repo"]][r["source"]].append(r)

          rng = random.Random(27027)
          boot_success = []
          boot_first = []
          for _ in range(BOOTSTRAPS):
              sample = []
              for repo in sorted(groups):
                  sources = sorted(groups[repo])
                  for _ in range(len(sources)):
                      source = rng.choice(sources)
                      sample.extend(groups[repo][source])
              boot_success.append(
                  (
                      sum(r["assisted"]["success"] for r in sample)
                      - sum(r["baseline"]["success"] for r in sample)
                  ) / len(sample)
              )
              boot_first.append(
                  (
                      sum(r["assisted"]["first_pass"] for r in sample)
                      - sum(r["baseline"]["first_pass"] for r in sample)
                  ) / len(sample)
              )

          def percentile(values, q):
              xs = sorted(values)
              pos = (len(xs) - 1) * q
              lo = int(math.floor(pos))
              hi = int(math.ceil(pos))
              if lo == hi:
                  return xs[lo]
              w = pos - lo
              return xs[lo] * (1 - w) + xs[hi] * w

          fold_deltas = [f["paired"]["success_rate_delta"] for f in folds]
          decision_accuracies = [f["decision_accuracy"] for f in folds]

          report = {
              "protocol": "E031 development-independent leave-one-repository-out",
              "folds": folds,
              "tasks": len(records),
              "baseline": condition("baseline"),
              "assisted": condition("assisted"),
              "decision_accuracy_micro": (
                  sum(r["recommendation_correct"] for r in records) / len(records)
              ),
              "decision_accuracy_macro_repo": statistics.mean(decision_accuracies),
              "paired": {
                  "both_success": len(both),
                  "assisted_only": assisted_only,
                  "baseline_only": baseline_only,
                  "neither": sum(
                      not r["baseline"]["success"] and not r["assisted"]["success"]
                      for r in records
                  ),
                  "success_rate_delta_micro": (
                      sum(r["assisted"]["success"] for r in records)
                      - sum(r["baseline"]["success"] for r in records)
                  ) / len(records),
                  "success_rate_delta_macro_repo": statistics.mean(fold_deltas),
                  "first_pass_rate_delta_micro": (
                      sum(r["assisted"]["first_pass"] for r in records)
                      - sum(r["baseline"]["first_pass"] for r in records)
                  ) / len(records),
                  "mcnemar_exact_two_sided_p": two_sided_binomial(
                      assisted_only,
                      assisted_only + baseline_only,
                  ),
                  "mean_correction_turn_delta_both_success": (
                      statistics.mean(deltas) if deltas else None
                  ),
                  "fewer_corrections_assisted": sum(d > 0 for d in deltas),
                  "same_corrections": sum(d == 0 for d in deltas),
                  "more_corrections_assisted": sum(d < 0 for d in deltas),
                  "sign_exact_two_sided_p": two_sided_binomial(
                      sum(d > 0 for d in deltas),
                      sum(d != 0 for d in deltas),
                  ),
              },
              "paired_cluster_bootstrap_95ci": {
                  "replicates": BOOTSTRAPS,
                  "unit": "source file within held-out repository",
                  "success_rate_delta_micro": [
                      percentile(boot_success, 0.025),
                      percentile(boot_success, 0.975),
                  ],
                  "first_pass_rate_delta_micro": [
                      percentile(boot_first, 0.025),
                      percentile(boot_first, 0.975),
                  ],
              },
          }

          ci = report["paired_cluster_bootstrap_95ci"]["success_rate_delta_micro"]
          report["confirmatory_gate"] = {
              "positive_pooled_delta": report["paired"]["success_rate_delta_micro"] > 0,
              "mcnemar_p_below_0_05": report["paired"]["mcnemar_exact_two_sided_p"] < 0.05,
              "cluster_bootstrap_lower_above_zero": ci[0] > 0,
          }
          report["confirmatory_gate"]["passed"] = (
              report["confirmatory_gate"]["positive_pooled_delta"]
              and report["confirmatory_gate"]["mcnemar_p_below_0_05"]
              and report["confirmatory_gate"]["cluster_bootstrap_lower_above_zero"]
          )

          with open("/tmp/e031-aggregate.json", "w", encoding="utf-8") as handle:
              json.dump({"summary": report, "records": records}, handle, indent=2, sort_keys=True)
          print("E031_AGGREGATE_JSON=" + json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: e031-aggregate
          path: /tmp/e031-aggregate.json
