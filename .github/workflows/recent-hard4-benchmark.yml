name: recent-hard4-benchmark

on:
  push:
    branches: ["analysis/recent-hard4-benchmark"]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: unixcoder-base-v4-${{ runner.os }}-py312-recent-hard4-v1
      - run: python -m pip install --upgrade pip
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install project with encoder dependencies
        run: python -m pip install -e ".[hf]"
      - name: Clone post-2024 repositories
        run: |
          mkdir -p /tmp/recent
          git clone --depth 1 https://github.com/microsoft/markitdown.git /tmp/recent/markitdown
          git clone --depth 1 https://github.com/browser-use/browser-use.git /tmp/recent/browser-use
          git clone --depth 1 https://github.com/unclecode/crawl4ai.git /tmp/recent/crawl4ai
          git clone --depth 1 https://github.com/D4Vinci/Scrapling.git /tmp/recent/scrapling
      - name: Run recent-code hard 4-way benchmark
        run: |
          python - <<'PY'
          import copy
          import json
          import math
          import re
          import subprocess
          from collections import Counter, defaultdict

          import torch
          from torch.nn import functional as F

          from cdm import CodeDecisionModel, HashTextEncoder, UniXcoderEncoder
          from cdm.repository import (
              namespace_repository_examples,
              repository_hard_masked_call_examples,
              split_repository_examples_by_namespace,
          )
          from cdm.training import encoded_example_loss, preencode_examples

          REPOS = {
              "browser-use": "/tmp/recent/browser-use",
              "crawl4ai": "/tmp/recent/crawl4ai",
              "markitdown": "/tmp/recent/markitdown",
              "scrapling": "/tmp/recent/scrapling",
          }
          K = 4
          BODY_CHARS = 512
          MAX_LENGTH = 512
          TOKEN = re.compile(r"[A-Za-z_][A-Za-z_0-9]*|\d+")

          def repo_of(example):
              return example.source.split("::", 1)[0]

          def token_set(text):
              stop = {
                  "def", "async", "return", "if", "else", "for", "in", "and", "or",
                  "not", "the", "a", "an", "to", "of", "is", "this", "call_target",
                  "none", "true", "false",
              }
              return {
                  t.lower() for t in TOKEN.findall(text)
                  if len(t) > 1 and t.lower() not in stop
              }

          def lexical_predictions(examples, signature_only=False):
              preds = []
              for example in examples:
                  ctx = token_set(example.context)
                  scores = []
                  for candidate in example.candidates:
                      text = candidate.split("\n", 1)[0] if signature_only else candidate
                      cand = token_set(text)
                      union = ctx | cand
                      scores.append(len(ctx & cand) / max(1, len(union)))
                  preds.append(max(range(len(scores)), key=scores.__getitem__))
              return preds

          @torch.no_grad()
          def cosine_predictions(encoded):
              preds = []
              for item in encoded:
                  context = F.normalize(item.decision_context.context.float(), dim=0)
                  candidates = F.normalize(item.candidate_embeddings.float(), dim=1)
                  preds.append(int(torch.mv(candidates, context).argmax()))
              return preds

          def accuracy_by_repo(examples, preds):
              buckets = defaultdict(lambda: [0, 0])
              correct = 0
              for example, pred in zip(examples, preds):
                  ok = int(pred == example.answer_index)
                  correct += ok
                  buckets[repo_of(example)][0] += ok
                  buckets[repo_of(example)][1] += 1
              return (
                  correct / len(examples),
                  {k: v[0] / v[1] for k, v in sorted(buckets.items())},
              )

          @torch.no_grad()
          def mean_loss(model, encoded):
              model.scorer.eval()
              return sum(float(encoded_example_loss(model, item)) for item in encoded) / len(encoded)

          @torch.no_grad()
          def model_predictions(model, encoded):
              device = next(model.scorer.parameters()).device
              preds = []
              model.scorer.eval()
              for item in encoded:
                  dc = type(item.decision_context)(
                      context=item.decision_context.context.to(device),
                      question=item.decision_context.question.to(device),
                  )
                  candidates = item.candidate_embeddings.to(device)
                  preds.append(int(model.score_encoded(dc, candidates).argmax()))
              return preds

          def train_head(encoded_train, encoded_val, encoded_test, test_examples, encoder, dim, seed):
              torch.manual_seed(seed)
              model = CodeDecisionModel(encoder=encoder, dim=dim, hidden=32)
              optimizer = torch.optim.AdamW(
                  model.scorer.parameters(),
                  lr=1e-3,
                  weight_decay=1e-2,
              )
              best_state = copy.deepcopy(model.scorer.state_dict())
              best_val = float("inf")
              best_epoch = 0
              stale = 0

              for epoch in range(1, 41):
                  model.scorer.train()
                  generator = torch.Generator().manual_seed(seed * 10000 + epoch)
                  order = torch.randperm(len(encoded_train), generator=generator).tolist()
                  for idx in order:
                      optimizer.zero_grad(set_to_none=True)
                      loss = encoded_example_loss(model, encoded_train[idx])
                      loss.backward()
                      torch.nn.utils.clip_grad_norm_(model.scorer.parameters(), 1.0)
                      optimizer.step()

                  val = mean_loss(model, encoded_val)
                  if val < best_val - 1e-5:
                      best_val = val
                      best_epoch = epoch
                      best_state = copy.deepcopy(model.scorer.state_dict())
                      stale = 0
                  else:
                      stale += 1
                  if epoch >= 8 and stale >= 7:
                      break

              model.scorer.load_state_dict(best_state)
              train_preds = model_predictions(model, encoded_train)
              val_preds = model_predictions(model, encoded_val)
              test_preds = model_predictions(model, encoded_test)

              def acc(encoded, preds):
                  return sum(
                      int(pred == item.answer_index)
                      for item, pred in zip(encoded, preds)
                  ) / len(encoded)

              test_acc, test_repo = accuracy_by_repo(test_examples, test_preds)
              return {
                  "seed": seed,
                  "best_epoch": best_epoch,
                  "best_validation_nll": best_val,
                  "train_accuracy": acc(encoded_train, train_preds),
                  "validation_accuracy": acc(encoded_val, val_preds),
                  "test_accuracy": test_acc,
                  "test_by_repo": test_repo,
              }

          pooled = []
          extraction = {}
          commits = {}
          for name, root in REPOS.items():
              commits[name] = subprocess.check_output(
                  ["git", "-C", root, "rev-parse", "HEAD"],
                  text=True,
              ).strip()
              examples = repository_hard_masked_call_examples(
                  root,
                  candidate_count=K,
                  candidate_body_chars=BODY_CHARS,
                  seed=0,
              )
              extraction[name] = {
                  "examples": len(examples),
                  "source_files": len({e.source for e in examples}),
              }
              pooled.extend(namespace_repository_examples(examples, name))

          dataset = split_repository_examples_by_namespace(
              pooled,
              seed=0,
              train_fraction=0.70,
              validation_fraction=0.15,
              small_namespace="train",
          )
          all_examples = list(dataset.train) + list(dataset.validation) + list(dataset.test)
          n_train = len(dataset.train)
          n_val = len(dataset.validation)

          def counts(examples):
              return dict(sorted(Counter(repo_of(e) for e in examples).items()))

          split_by_repo = {
              "train": counts(dataset.train),
              "validation": counts(dataset.validation),
              "test": counts(dataset.test),
          }

          # Lexical baselines: both all examples (zero-shot descriptive) and held-out test.
          lex_all_preds = lexical_predictions(pooled, False)
          lex_all, lex_all_repo = accuracy_by_repo(pooled, lex_all_preds)
          lex_test_preds = lexical_predictions(dataset.test, False)
          lex_test, lex_test_repo = accuracy_by_repo(dataset.test, lex_test_preds)

          torch.manual_seed(12345)
          hash_encoder = HashTextEncoder(dim=128, buckets=32768)
          for p in hash_encoder.parameters():
              p.requires_grad_(False)
          hash_encoder.eval()
          hash_shell = CodeDecisionModel(hash_encoder, dim=128, hidden=32)
          hash_all_ordered = preencode_examples(hash_shell, all_examples, batch_size=64)
          hash_train = hash_all_ordered[:n_train]
          hash_val = hash_all_ordered[n_train:n_train+n_val]
          hash_test = hash_all_ordered[n_train+n_val:]
          hash_test_preds = cosine_predictions(hash_test)
          hash_test_acc, hash_test_repo = accuracy_by_repo(dataset.test, hash_test_preds)
          hash_runs = [
              train_head(
                  hash_train, hash_val, hash_test, dataset.test,
                  hash_encoder, 128, seed,
              )
              for seed in range(5)
          ]

          unix_encoder = UniXcoderEncoder(frozen=True, max_length=MAX_LENGTH)
          unix_shell = CodeDecisionModel(unix_encoder, dim=unix_encoder.dim, hidden=32)

          # All-example zero-shot geometry.
          unix_all_natural = preencode_examples(unix_shell, pooled, batch_size=8)
          unix_all_preds = cosine_predictions(unix_all_natural)
          unix_all_acc, unix_all_repo = accuracy_by_repo(pooled, unix_all_preds)

          # Split-order cache for training/evaluation.
          unix_all_ordered = preencode_examples(unix_shell, all_examples, batch_size=8)
          unix_train = unix_all_ordered[:n_train]
          unix_val = unix_all_ordered[n_train:n_train+n_val]
          unix_test = unix_all_ordered[n_train+n_val:]
          unix_test_preds = cosine_predictions(unix_test)
          unix_test_acc, unix_test_repo = accuracy_by_repo(dataset.test, unix_test_preds)
          unix_runs = [
              train_head(
                  unix_train, unix_val, unix_test, dataset.test,
                  unix_encoder, unix_encoder.dim, seed,
              )
              for seed in range(5)
          ]

          marker_positions = [
              len(unix_encoder.tokenizer.tokenize(
                  e.context.split("__CALL_TARGET__", 1)[0]
              ))
              for e in pooled
          ]

          def summarize(runs):
              values = [r["test_accuracy"] for r in runs]
              mean = sum(values) / len(values)
              std = math.sqrt(sum((x - mean) ** 2 for x in values) / len(values))
              repos = sorted({k for r in runs for k in r["test_by_repo"]})
              return {
                  "mean": mean,
                  "std": std,
                  "min": min(values),
                  "max": max(values),
                  "by_repo": {
                      repo: {
                          "mean": sum(r["test_by_repo"][repo] for r in runs) / len(runs),
                          "min": min(r["test_by_repo"][repo] for r in runs),
                          "max": max(r["test_by_repo"][repo] for r in runs),
                      }
                      for repo in repos
                  },
              }

          report = {
              "selection": "GitHub Python repositories created after 2024-01-01",
              "commits": commits,
              "candidate_count": K,
              "extraction": extraction,
              "total_examples": len(pooled),
              "split_sizes": {
                  "train": len(dataset.train),
                  "validation": len(dataset.validation),
                  "test": len(dataset.test),
              },
              "split_by_repo": split_by_repo,
              "random_expected": 1.0 / K,
              "lexical_all": lex_all,
              "lexical_all_by_repo": lex_all_repo,
              "lexical_test": lex_test,
              "lexical_test_by_repo": lex_test_repo,
              "hash_cosine_test": hash_test_acc,
              "hash_cosine_test_by_repo": hash_test_repo,
              "hash_head_runs": hash_runs,
              "hash_head_summary": summarize(hash_runs),
              "unixcoder_cosine_all": unix_all_acc,
              "unixcoder_cosine_all_by_repo": unix_all_repo,
              "unixcoder_cosine_test": unix_test_acc,
              "unixcoder_cosine_test_by_repo": unix_test_repo,
              "unixcoder_head_runs": unix_runs,
              "unixcoder_head_summary": summarize(unix_runs),
              "marker_truncated_count": sum(p >= MAX_LENGTH - 4 for p in marker_positions),
              "marker_position_max_tokens": max(marker_positions) if marker_positions else 0,
          }
          print("RECENT_HARD4_JSON=" + json.dumps(report, sort_keys=True))
          PY
