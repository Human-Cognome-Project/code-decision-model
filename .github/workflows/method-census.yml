name: method-call-census

on:
  push:
    branches: ["analysis/method-call-census"]

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: python -m pip install -e . --no-deps
      - name: Clone exact benchmark revisions
        run: |
          set -e
          clone_at () {
            url="$1"
            sha="$2"
            dest="$3"
            git clone --filter=blob:none --no-checkout "$url" "$dest"
            git -C "$dest" fetch --depth 1 origin "$sha"
            git -C "$dest" checkout --detach "$sha"
          }
          mkdir -p /tmp/recent
          clone_at https://github.com/browser-use/browser-use.git d8110c5ff87ccba887aaa726cdb780f2f84bef8d /tmp/recent/browser-use
          clone_at https://github.com/unclecode/crawl4ai.git 862f6bccb9c063f49b9d42701baa0eea17a4993f /tmp/recent/crawl4ai
          clone_at https://github.com/microsoft/markitdown.git b8f79c57ebc0044be41323d89b2a45d3fda8460e /tmp/recent/markitdown
          clone_at https://github.com/D4Vinci/Scrapling.git 08f107b1240fd72847b0f5e10426c7e6cc16e67e /tmp/recent/scrapling
      - name: Count function and method decisions
        run: |
          python - <<'PY'
          import json
          from cdm.methods import repository_hard_masked_method_call_examples
          from cdm.repository import (
              namespace_repository_examples,
              repository_hard_masked_call_examples,
              split_repository_examples_by_namespace,
          )

          REPOS = {
              'browser-use': '/tmp/recent/browser-use',
              'crawl4ai': '/tmp/recent/crawl4ai',
              'markitdown': '/tmp/recent/markitdown',
              'scrapling': '/tmp/recent/scrapling',
          }

          report = {}
          pooled4 = []
          for name, root in REPOS.items():
              report[name] = {}
              for k in (4, 8):
                  funcs = repository_hard_masked_call_examples(
                      root, candidate_count=k, candidate_body_chars=512, seed=0
                  )
                  methods = repository_hard_masked_method_call_examples(
                      root, candidate_count=k, candidate_body_chars=512, seed=0
                  )
                  report[name][str(k)] = {
                      'functions': len(funcs),
                      'function_sources': len({e.source for e in funcs}),
                      'methods': len(methods),
                      'method_sources': len({e.source for e in methods}),
                      'combined': len(funcs) + len(methods),
                      'combined_sources': len({e.source for e in [*funcs, *methods]}),
                  }
                  if k == 4:
                      pooled4.extend(namespace_repository_examples(funcs, name))
                      pooled4.extend(namespace_repository_examples(methods, name))

          dataset = split_repository_examples_by_namespace(
              pooled4, seed=0, train_fraction=0.70, validation_fraction=0.15,
              small_namespace='train'
          )
          def by_repo(examples):
              out = {}
              for e in examples:
                  repo = e.source.split('::', 1)[0]
                  out[repo] = out.get(repo, 0) + 1
              return dict(sorted(out.items()))

          report['combined4_split'] = {
              'total': len(pooled4),
              'train': len(dataset.train),
              'validation': len(dataset.validation),
              'test': len(dataset.test),
              'train_by_repo': by_repo(dataset.train),
              'validation_by_repo': by_repo(dataset.validation),
              'test_by_repo': by_repo(dataset.test),
              'test_sources': len({e.source for e in dataset.test}),
          }
          print('METHOD_CENSUS_JSON=' + json.dumps(report, sort_keys=True))
          PY
