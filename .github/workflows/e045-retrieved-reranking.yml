name: e045-retrieved-reranking

on:
  push:
    branches: ["analysis/e045-retrieved-reranking-live"]

jobs:
  rerank:
    strategy:
      fail-fast: false
      matrix:
        heldout: [alphafold, pyodide, optuna, pytest]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: e025-qwen05-coderank-${{ runner.os }}-py312-v1
      - run: python -m pip install --upgrade pip
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install scorer dependencies
        run: python -m pip install -e ".[coderank]"
      - name: Clone exact E031 revisions
        run: |
          set -e
          clone_at () {
            url="$1"; sha="$2"; dest="$3"
            git clone --filter=blob:none --no-checkout "$url" "$dest"
            git -C "$dest" fetch --depth 1 origin "$sha"
            git -C "$dest" checkout --detach "$sha"
          }
          mkdir -p /tmp/e045-repos
          clone_at https://github.com/google-deepmind/alphafold.git c77e5d2a8961d1a353632c462914ff0a32a950f6 /tmp/e045-repos/alphafold
          clone_at https://github.com/pyodide/pyodide.git e4d3ae954d01d61a3e90531d63b881f2d33361b4 /tmp/e045-repos/pyodide
          clone_at https://github.com/optuna/optuna.git 7d08bfa1824606d7caedb80abfd8558bc63826d7 /tmp/e045-repos/optuna
          clone_at https://github.com/pytest-dev/pytest.git 6a9ba0f02f827a54cff6ab4da0dddecd65444ff6 /tmp/e045-repos/pytest
      - name: Run held-out retrieved-reranking fold
        env:
          HELDOUT_REPO: ${{ matrix.heldout }}
        run: |
          python - <<'PY'
          import ast
          import gc
          import json
          import os
          import re
          import statistics
          import time
          from dataclasses import replace
          from pathlib import Path

          import torch
          import torch.nn.functional as F

          from cdm import CodeDecisionModel, CodeRankEncoder, PairwiseMLPScorer
          from cdm.crossfile import (
              _cross_file_imports,
              repository_hard_masked_cross_file_call_examples,
          )
          from cdm.focus import focus_hard_call_context
          from cdm.methods import repository_hard_masked_method_call_examples
          from cdm.repository import (
              collect_python_symbols,
              namespace_repository_examples,
              repository_hard_masked_call_examples,
          )
          from cdm.scope import (
              bindable_mask,
              distinct_by_rendering,
              in_scope_pools,
              render_symbol,
          )
          from cdm.training import collate_encoded_examples, preencode_examples

          REPOS = {
              "alphafold": "/tmp/e045-repos/alphafold",
              "pyodide": "/tmp/e045-repos/pyodide",
              "optuna": "/tmp/e045-repos/optuna",
              "pytest": "/tmp/e045-repos/pytest",
          }
          EXPECTED_EXTRACTION = {
              "alphafold": {"functions": 23, "methods": 3},
              "pyodide": {"functions": 34, "methods": 19},
              "optuna": {"functions": 79, "methods": 55},
              "pytest": {"functions": 86, "methods": 122},
          }
          EXPECTED_TOP1 = {
              "alphafold": 11,
              "pyodide": 36,
              "optuna": 87,
              "pytest": 110,
          }
          EXPECTED_E043 = {
              "alphafold": 0,
              "pyodide": 3,
              "optuna": 187,
              "pytest": 75,
          }

          HELDOUT = os.environ["HELDOUT_REPO"]
          ROOT = Path(REPOS[HELDOUT])
          K = 4
          BODY_CHARS = 512
          SHORTLIST = 32

          def repo_of(example):
              return example.source.split("::", 1)[0]

          # Reconstruct the exact E031 training population and frozen scorer.
          pooled = []
          extraction = {}
          for name, root in REPOS.items():
              funcs = repository_hard_masked_call_examples(
                  root, candidate_count=K, candidate_body_chars=BODY_CHARS, seed=0
              )
              methods = repository_hard_masked_method_call_examples(
                  root, candidate_count=K, candidate_body_chars=BODY_CHARS, seed=0
              )
              extraction[name] = {"functions": len(funcs), "methods": len(methods)}
              pooled.extend(namespace_repository_examples(funcs, name))
              pooled.extend(namespace_repository_examples(methods, name))

          if extraction != EXPECTED_EXTRACTION:
              raise RuntimeError(f"E031 extraction drift: {extraction!r}")
          if len(pooled) != 421:
              raise RuntimeError(f"E031 total drift: {len(pooled)} != 421")

          train_examples = [e for e in pooled if repo_of(e) != HELDOUT]
          original_test = [e for e in pooled if repo_of(e) == HELDOUT]
          train_focus = [focus_hard_call_context(e, radius_lines=0) for e in train_examples]
          test_focus = [focus_hard_call_context(e, radius_lines=0) for e in original_test]

          encoder = CodeRankEncoder(max_length=512, normalize_embeddings=False)
          shell = CodeDecisionModel(
              encoder=encoder,
              dim=encoder.dim,
              scorer=PairwiseMLPScorer(encoder.dim, hidden=32),
          )
          encoded = preencode_examples(shell, [*train_focus, *test_focus], batch_size=8)
          n_train = len(train_focus)
          encoded_train = encoded[:n_train]
          encoded_test = encoded[n_train:]

          torch.manual_seed(2)
          shell.scorer = PairwiseMLPScorer(encoder.dim, hidden=32)
          optimizer = torch.optim.AdamW(
              shell.scorer.parameters(), lr=1e-3, weight_decay=1e-2
          )
          order = torch.randperm(
              len(encoded_train),
              generator=torch.Generator().manual_seed(20001),
          ).tolist()
          shell.scorer.train()
          for start in range(0, len(order), 32):
              ids = order[start:start + 32]
              batch = collate_encoded_examples([encoded_train[i] for i in ids])
              optimizer.zero_grad(set_to_none=True)
              logits = shell.score_encoded_batch(
                  batch.contexts, batch.questions, batch.candidate_embeddings
              )
              loss = torch.nn.functional.cross_entropy(logits, batch.targets)
              loss.backward()
              torch.nn.utils.clip_grad_norm_(shell.scorer.parameters(), 1.0)
              optimizer.step()

          shell.scorer.eval()
          original_predictions = []
          with torch.no_grad():
              for item in encoded_test:
                  logits = shell.score_encoded(
                      item.decision_context, item.candidate_embeddings
                  )
                  original_predictions.append(int(logits.argmax()))
          original_correct = sum(
              pred == example.answer_index
              for pred, example in zip(original_predictions, original_test)
          )
          if original_correct != EXPECTED_TOP1[HELDOUT]:
              raise RuntimeError(
                  f"E031 scorer reproduction drift for {HELDOUT}: "
                  f"{original_correct} != {EXPECTED_TOP1[HELDOUT]}"
              )

          # Freeze exact E043 task/pool construction before retrieval/reranking.
          examples = repository_hard_masked_cross_file_call_examples(
              ROOT,
              candidate_count=K,
              candidate_body_chars=BODY_CHARS,
              seed=0,
          )
          if len(examples) != EXPECTED_E043[HELDOUT]:
              raise RuntimeError(
                  f"E043 extraction drift for {HELDOUT}: "
                  f"{len(examples)} != {EXPECTED_E043[HELDOUT]}"
              )

          scope = in_scope_pools(ROOT)
          _, by_file = collect_python_symbols(ROOT)
          known_files = frozenset(by_file)
          tasks = []
          exclusions = []

          for index, example in enumerate(examples):
              focused = focus_hard_call_context(example, radius_lines=0)
              wanted = example.candidates[example.answer_index]

              repo_symbols = scope.repository_pool(example)
              rendered_all = [
                  render_symbol(symbol, body_chars=BODY_CHARS)
                  for symbol in repo_symbols
              ]
              if wanted not in rendered_all:
                  raise RuntimeError(
                      f"E045 integrity failure target absent: {HELDOUT}:{example.source}"
                  )

              mask = bindable_mask(example, repo_symbols, body_chars=BODY_CHARS)
              bindable = [
                  symbol for symbol, allowed in zip(repo_symbols, mask) if allowed
              ]
              distinct, counts = distinct_by_rendering(
                  bindable, body_chars=BODY_CHARS
              )
              target_count = counts.get(wanted, 0)
              if target_count == 0:
                  raise RuntimeError(
                      f"E045 integrity failure target vetoed: {HELDOUT}:{example.source}"
                  )
              if target_count > 1:
                  exclusions.append({
                      "source_index": index,
                      "source": example.source,
                      "reason": "ambiguous_target_rendering",
                  })
                  continue

              candidate_texts = tuple(
                  render_symbol(symbol, body_chars=BODY_CHARS)
                  for symbol in distinct
              )
              target_index = candidate_texts.index(wanted)

              # Same E043 leakage guard.
              source_path = ROOT / example.source
              source_text = source_path.read_text(encoding="utf-8")
              tree = ast.parse(source_text, filename=example.source)
              imports = _cross_file_imports(
                  tree,
                  known_files=known_files,
                  importing_file=Path(example.source),
                  by_file=by_file,
                  source_roots=("src",),
              )
              target_aliases = [
                  alias for alias, symbol in imports.items()
                  if render_symbol(symbol, body_chars=BODY_CHARS) == wanted
              ]
              if not target_aliases:
                  raise RuntimeError(
                      f"E045 could not reconstruct target import: "
                      f"{HELDOUT}:{example.source}"
                  )
              for alias in target_aliases:
                  if re.search(rf"\b{re.escape(alias)}\b", focused.context):
                      raise RuntimeError(
                          f"E045 alias leakage: {alias} {HELDOUT}:{example.source}"
                      )
              target_name = wanted.splitlines()[0].split("(", 1)[0].strip()
              if re.search(rf"\b{re.escape(target_name)}\b", focused.context):
                  raise RuntimeError(
                      f"E045 target-name leakage: {target_name} "
                      f"{HELDOUT}:{example.source}"
                  )

              tasks.append({
                  "source_index": index,
                  "source": example.source,
                  "focused": focused,
                  "candidate_texts": candidate_texts,
                  "target_index": target_index,
                  "pool_size": len(candidate_texts),
              })

          if len(tasks) + len(exclusions) != len(examples):
              raise RuntimeError("E045 population accounting drift")

          # Empty E043 strata are valid, but the E031 continuity guard above still ran.
          if not tasks:
              summary = {
                  "heldout_repo": HELDOUT,
                  "e031_guard": {
                      "top1_correct": original_correct,
                      "expected_top1_correct": EXPECTED_TOP1[HELDOUT],
                  },
                  "extracted_tasks": len(examples),
                  "retained_tasks": 0,
                  "ambiguity_exclusions": exclusions,
                  "retrieval_rank1": 0,
                  "retrieval_hit_at_32": 0,
                  "reranked_top1": 0,
              }
              path = f"/tmp/e045-{HELDOUT}.json"
              with open(path, "w", encoding="utf-8") as handle:
                  json.dump({"summary": summary, "records": []}, handle, indent=2, sort_keys=True)
              print("E045_FOLD=" + json.dumps(summary, sort_keys=True))
              raise SystemExit(0)

          # Exact E043 CodeRank retrieval, using the same frozen encoder.
          unique_candidates = []
          seen_candidates = set()
          unique_contexts = []
          seen_contexts = set()
          for task in tasks:
              for text in task["candidate_texts"]:
                  if text not in seen_candidates:
                      seen_candidates.add(text)
                      unique_candidates.append(text)
              context = task["focused"].context
              if context not in seen_contexts:
                  seen_contexts.add(context)
                  unique_contexts.append(context)

          def encode_batched(texts, role, batch_size=32):
              chunks = []
              for start in range(0, len(texts), batch_size):
                  batch = texts[start:start + batch_size]
                  chunks.append(
                      encoder.encode_role(batch, role=role).detach().cpu()
                  )
              return torch.cat(chunks, dim=0)

          candidate_embeddings = F.normalize(
              encode_batched(unique_candidates, "candidate").float(), dim=-1
          )
          context_embeddings = F.normalize(
              encode_batched(unique_contexts, "context").float(), dim=-1
          )
          candidate_index = {text: i for i, text in enumerate(unique_candidates)}
          context_index = {text: i for i, text in enumerate(unique_contexts)}

          records = []
          rerank_examples = []
          rerank_record_indices = []

          for task in tasks:
              ids = [candidate_index[text] for text in task["candidate_texts"]]
              q = context_embeddings[context_index[task["focused"].context]]
              c = candidate_embeddings[ids]
              scores = torch.mv(c, q).tolist()
              ranked = sorted(range(len(scores)), key=lambda i: (-scores[i], i))
              retrieval_rank = ranked.index(task["target_index"]) + 1
              shortlist_ids = ranked[:min(SHORTLIST, len(ranked))]
              shortlist_texts = tuple(task["candidate_texts"][i] for i in shortlist_ids)
              retrieval_hit = task["target_index"] in shortlist_ids
              baseline_correct = retrieval_rank == 1

              record = {
                  "repo": HELDOUT,
                  "source_index": task["source_index"],
                  "source": task["source"],
                  "pool_size": task["pool_size"],
                  "shortlist_size": len(shortlist_ids),
                  "retrieval_rank": retrieval_rank,
                  "retrieval_hit": retrieval_hit,
                  "baseline_correct": baseline_correct,
                  "rerank_correct": False,
                  "rerank_target_rank": None,
                  "uniform_pipeline_expectation": (
                      1.0 / len(shortlist_ids) if retrieval_hit else 0.0
                  ),
              }
              records.append(record)

              if retrieval_hit:
                  answer_index = shortlist_ids.index(task["target_index"])
                  posed = replace(
                      task["focused"],
                      candidates=shortlist_texts,
                      answer_index=answer_index,
                  )
                  rerank_record_indices.append(len(records) - 1)
                  rerank_examples.append(posed)

          # Frozen PairwiseMLP reranking only after E031 and E043 guards are established.
          t0 = time.perf_counter()
          encoded_rerank = preencode_examples(shell, rerank_examples, batch_size=8)
          encode_seconds = time.perf_counter() - t0
          score_seconds = 0.0

          with torch.no_grad():
              for record_index, example, item in zip(
                  rerank_record_indices, rerank_examples, encoded_rerank
              ):
                  t1 = time.perf_counter()
                  logits = shell.score_encoded(
                      item.decision_context, item.candidate_embeddings
                  )
                  score_seconds += time.perf_counter() - t1
                  values = [float(v) for v in logits.detach().cpu()]
                  ranked = sorted(range(len(values)), key=lambda i: (-values[i], i))
                  target_rank = ranked.index(example.answer_index) + 1
                  records[record_index]["rerank_target_rank"] = target_rank
                  records[record_index]["rerank_correct"] = target_rank == 1

          summary = {
              "heldout_repo": HELDOUT,
              "e031_guard": {
                  "top1_correct": original_correct,
                  "expected_top1_correct": EXPECTED_TOP1[HELDOUT],
              },
              "extracted_tasks": len(examples),
              "retained_tasks": len(records),
              "ambiguity_exclusions": exclusions,
              "retrieval_rank1": sum(r["baseline_correct"] for r in records),
              "retrieval_hit_at_32": sum(r["retrieval_hit"] for r in records),
              "reranked_top1": sum(r["rerank_correct"] for r in records),
              "retrieval_hits_rescued": sum(
                  (not r["baseline_correct"]) and r["rerank_correct"] for r in records
              ),
              "retrieval_rank1_spoiled": sum(
                  r["baseline_correct"] and (not r["rerank_correct"]) for r in records
              ),
              "uniform_pipeline_expected_successes": sum(
                  r["uniform_pipeline_expectation"] for r in records
              ),
              "runtime": {
                  "rerank_preencode_seconds": encode_seconds,
                  "rerank_score_seconds": score_seconds,
              },
          }

          path = f"/tmp/e045-{HELDOUT}.json"
          with open(path, "w", encoding="utf-8") as handle:
              json.dump({"summary": summary, "records": records}, handle, indent=2, sort_keys=True)
          print("E045_FOLD=" + json.dumps(summary, sort_keys=True))

          del encoded, encoded_train, encoded_test, encoded_rerank, shell, encoder, optimizer
          gc.collect()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: e045-${{ matrix.heldout }}
          path: /tmp/e045-${{ matrix.heldout }}.json

  aggregate:
    needs: rerank
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: e045-*
          path: /tmp/e045
          merge-multiple: true
      - name: Aggregate retrieved-reranking folds
        run: |
          python - <<'PY'
          import glob
          import json
          import math
          import random
          import statistics
          from collections import Counter, defaultdict

          EXPECTED_E043 = {
              "alphafold": 0,
              "pyodide": 3,
              "optuna": 187,
              "pytest": 75,
          }
          EXPECTED_RANK1 = 122
          EXPECTED_HIT32 = 224
          BOOTSTRAPS = 5000
          SEED = 45045

          folds = []
          records = []
          exclusions = []
          for path in sorted(glob.glob("/tmp/e045/e045-*.json")):
              with open(path, encoding="utf-8") as handle:
                  payload = json.load(handle)
              folds.append(payload["summary"])
              records.extend(payload["records"])
              exclusions.extend(
                  {"repo": payload["summary"]["heldout_repo"], **row}
                  for row in payload["summary"]["ambiguity_exclusions"]
              )

          if len(folds) != 4:
              raise RuntimeError(f"expected four E045 folds, got {len(folds)}")
          counts = {f["heldout_repo"]: f["retained_tasks"] for f in folds}
          if counts != EXPECTED_E043:
              raise RuntimeError(f"E045 retained-count drift: {counts!r}")
          if exclusions:
              raise RuntimeError(f"E045 unexpected ambiguity exclusions: {exclusions!r}")
          if len(records) != 265:
              raise RuntimeError(f"E045 total drift: {len(records)} != 265")

          baseline_successes = sum(r["baseline_correct"] for r in records)
          retrieval_hits = sum(r["retrieval_hit"] for r in records)
          if baseline_successes != EXPECTED_RANK1:
              raise RuntimeError(
                  f"E043 rank-1 continuity drift: {baseline_successes} != {EXPECTED_RANK1}"
              )
          if retrieval_hits != EXPECTED_HIT32:
              raise RuntimeError(
                  f"E043 recall@32 continuity drift: {retrieval_hits} != {EXPECTED_HIT32}"
              )

          rerank_successes = sum(r["rerank_correct"] for r in records)
          rescued = sum(
              (not r["baseline_correct"]) and r["rerank_correct"] for r in records
          )
          spoiled = sum(
              r["baseline_correct"] and (not r["rerank_correct"]) for r in records
          )
          delta = (rerank_successes - baseline_successes) / len(records)

          # Exact two-sided McNemar via the conditional binomial distribution.
          discordant = rescued + spoiled
          if discordant:
              k = min(rescued, spoiled)
              tail = sum(math.comb(discordant, i) for i in range(k + 1)) / (2 ** discordant)
              mcnemar_p = min(1.0, 2.0 * tail)
          else:
              mcnemar_p = 1.0

          groups = defaultdict(lambda: defaultdict(list))
          for row in records:
              groups[row["repo"]][row["source"]].append(row)

          def percentile(values, q):
              xs = sorted(values)
              pos = (len(xs) - 1) * q
              lo = int(math.floor(pos))
              hi = int(math.ceil(pos))
              if lo == hi:
                  return xs[lo]
              w = pos - lo
              return xs[lo] * (1 - w) + xs[hi] * w

          rng = random.Random(SEED)
          boots = []
          for _ in range(BOOTSTRAPS):
              sample = []
              for repo in sorted(groups):
                  sources = sorted(groups[repo])
                  for _ in range(len(sources)):
                      source = rng.choice(sources)
                      sample.extend(groups[repo][source])
              boots.append(statistics.mean(
                  float(r["rerank_correct"]) - float(r["baseline_correct"])
                  for r in sample
              ))
          ci = [percentile(boots, .025), percentile(boots, .975)]

          per_repo = {}
          for repo in sorted(groups):
              rows = [r for r in records if r["repo"] == repo]
              per_repo[repo] = {
                  "n": len(rows),
                  "retrieval_rank1": sum(r["baseline_correct"] for r in rows),
                  "retrieval_hit_at_32": sum(r["retrieval_hit"] for r in rows),
                  "reranked_top1": sum(r["rerank_correct"] for r in rows),
                  "paired_delta": (
                      sum(r["rerank_correct"] for r in rows)
                      - sum(r["baseline_correct"] for r in rows)
                  ) / len(rows),
              }

          hit_rows = [r for r in records if r["retrieval_hit"]]
          rerank_ranks = [
              r["rerank_target_rank"] for r in hit_rows
              if r["rerank_target_rank"] is not None
          ]
          uniform_expected = sum(
              r["uniform_pipeline_expectation"] for r in records
          )

          report = {
              "protocol": "E045 CodeRank top-32 retrieval + frozen E031 PairwiseMLP reranking",
              "tasks": len(records),
              "retrieval_rank1_successes": baseline_successes,
              "retrieval_rank1_rate": baseline_successes / len(records),
              "retrieval_hit_at_32": retrieval_hits,
              "retrieval_recall_at_32": retrieval_hits / len(records),
              "reranked_top1_successes": rerank_successes,
              "reranked_top1_rate": rerank_successes / len(records),
              "paired_delta": delta,
              "rescued_rank2_to_32": rescued,
              "spoiled_retrieval_rank1": spoiled,
              "mcnemar_exact_p": mcnemar_p,
              "cluster_bootstrap_95ci_paired_delta": ci,
              "bootstrap_replicates": BOOTSTRAPS,
              "bootstrap_seed": SEED,
              "conditional_rerank_accuracy_on_retrieval_hits": (
                  rerank_successes / retrieval_hits
              ),
              "retrieval_plus_uniform_expected_successes": uniform_expected,
              "retrieval_plus_uniform_expected_rate": uniform_expected / len(records),
              "rerank_target_rank_histogram_on_hits": dict(sorted(Counter(rerank_ranks).items())),
              "per_repo": per_repo,
              "folds": sorted(folds, key=lambda f: f["heldout_repo"]),
          }
          report["primary_gate"] = {
              "reranked_successes_gt_122": rerank_successes > EXPECTED_RANK1,
              "mcnemar_p_lt_0_05": mcnemar_p < 0.05,
              "cluster_lower_delta_gt_zero": ci[0] > 0.0,
          }
          report["primary_gate"]["passed"] = all(report["primary_gate"].values())
          report["continuation"] = (
              "preregister_end_to_end_bounded_pipeline"
              if report["primary_gate"]["passed"]
              else "stop_exact_coderank_e031_reranker_path"
          )

          with open("/tmp/e045-aggregate.json", "w", encoding="utf-8") as handle:
              json.dump({"summary": report, "records": records}, handle, indent=2, sort_keys=True)
          print("E045_AGGREGATE=" + json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: e045-aggregate
          path: /tmp/e045-aggregate.json
