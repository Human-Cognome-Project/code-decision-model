name: e046-label-free-neighbourhood-retrieval

on:
  push:
    branches: ["analysis/e046-label-free-neighbourhood-live"]

jobs:
  retrieve:
    strategy:
      fail-fast: false
      matrix:
        heldout: [alphafold, pyodide, optuna, pytest]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: e025-qwen05-coderank-${{ runner.os }}-py312-v1
      - run: python -m pip install --upgrade pip
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install CodeRank dependencies
        run: python -m pip install -e ".[coderank]"
      - name: Clone exact E031 revisions
        run: |
          set -e
          clone_at () {
            url="$1"; sha="$2"; dest="$3"
            git clone --filter=blob:none --no-checkout "$url" "$dest"
            git -C "$dest" fetch --depth 1 origin "$sha"
            git -C "$dest" checkout --detach "$sha"
          }
          mkdir -p /tmp/e046-repos
          clone_at https://github.com/google-deepmind/alphafold.git c77e5d2a8961d1a353632c462914ff0a32a950f6 /tmp/e046-repos/alphafold
          clone_at https://github.com/pyodide/pyodide.git e4d3ae954d01d61a3e90531d63b881f2d33361b4 /tmp/e046-repos/pyodide
          clone_at https://github.com/optuna/optuna.git 7d08bfa1824606d7caedb80abfd8558bc63826d7 /tmp/e046-repos/optuna
          clone_at https://github.com/pytest-dev/pytest.git 6a9ba0f02f827a54cff6ab4da0dddecd65444ff6 /tmp/e046-repos/pytest
      - name: Run held-out label-free retrieval fold
        env:
          HELDOUT_REPO: ${{ matrix.heldout }}
        run: |
          python - <<'PY'
          import ast
          import json
          import os
          import re
          import statistics
          from dataclasses import replace
          from pathlib import Path

          import torch
          import torch.nn.functional as F

          from cdm import CodeRankEncoder
          from cdm.crossfile import (
              _cross_file_imports,
              _module_file,
              repository_hard_masked_cross_file_call_examples,
          )
          from cdm.focus import focus_hard_call_context
          from cdm.neighbourhood import import_neighbourhoods
          from cdm.scope import (
              _names_read_outside,
              bindable_mask,
              caller_name,
              distinct_by_rendering,
              in_scope_pools,
              render_symbol,
          )

          REPOS = {
              "alphafold": "/tmp/e046-repos/alphafold",
              "pyodide": "/tmp/e046-repos/pyodide",
              "optuna": "/tmp/e046-repos/optuna",
              "pytest": "/tmp/e046-repos/pytest",
          }
          EXPECTED_TASKS = {
              "alphafold": 0,
              "pyodide": 3,
              "optuna": 187,
              "pytest": 75,
          }
          HELDOUT = os.environ["HELDOUT_REPO"]
          ROOT = Path(REPOS[HELDOUT])
          BODY_CHARS = 512
          SHORTLIST = 32

          examples = repository_hard_masked_cross_file_call_examples(
              ROOT,
              candidate_count=4,
              candidate_body_chars=BODY_CHARS,
              seed=0,
          )
          if len(examples) != EXPECTED_TASKS[HELDOUT]:
              raise RuntimeError(
                  f"E046 extraction drift for {HELDOUT}: "
                  f"{len(examples)} != {EXPECTED_TASKS[HELDOUT]}"
              )

          scope = in_scope_pools(ROOT)
          neighbourhoods = import_neighbourhoods(ROOT)
          tasks = []
          exclusions = []

          def label_free_files(example):
              tree = neighbourhoods.trees.get(example.source)
              if tree is None:
                  return ()
              outside = _names_read_outside(tree, caller_name(example))
              importing = Path(example.source)
              files = []

              def add(module, level):
                  resolved = _module_file(
                      neighbourhoods.known_files,
                      importing,
                      module,
                      level,
                      source_roots=neighbourhoods.source_roots,
                  )
                  if (
                      resolved is not None
                      and resolved != example.source
                      and resolved not in files
                  ):
                      files.append(resolved)

              for statement in tree.body:
                  if isinstance(statement, ast.ImportFrom):
                      kept = [
                          alias for alias in statement.names
                          if alias.name != "*"
                          and (alias.asname or alias.name) in outside
                      ]
                      if not kept:
                          continue
                      add(statement.module, statement.level)
                      for alias in kept:
                          submodule = (
                              f"{statement.module}.{alias.name}"
                              if statement.module else alias.name
                          )
                          add(submodule, statement.level)
                  elif isinstance(statement, ast.Import):
                      for alias in statement.names:
                          bound = alias.asname or alias.name.split(".")[0]
                          if bound in outside:
                              add(alias.name, 0)
              return tuple(files)

          for index, example in enumerate(examples):
              focused = focus_hard_call_context(example, radius_lines=0)
              wanted = example.candidates[example.answer_index]

              repo_symbols = scope.repository_pool(example)
              rendered_all = [
                  render_symbol(symbol, body_chars=BODY_CHARS)
                  for symbol in repo_symbols
              ]
              if wanted not in rendered_all:
                  raise RuntimeError(
                      f"E046 integrity failure target absent: {HELDOUT}:{example.source}"
                  )

              mask = bindable_mask(example, repo_symbols, body_chars=BODY_CHARS)
              bindable = [
                  symbol for symbol, allowed in zip(repo_symbols, mask) if allowed
              ]
              distinct, counts = distinct_by_rendering(
                  bindable, body_chars=BODY_CHARS
              )
              target_count = counts.get(wanted, 0)
              if target_count == 0:
                  raise RuntimeError(
                      f"E046 integrity failure target vetoed: {HELDOUT}:{example.source}"
                  )
              if target_count > 1:
                  exclusions.append({
                      "source_index": index,
                      "source": example.source,
                      "reason": "ambiguous_target_rendering",
                  })
                  continue

              candidate_texts = tuple(
                  render_symbol(symbol, body_chars=BODY_CHARS)
                  for symbol in distinct
              )
              target_index = candidate_texts.index(wanted)

              # Preserve E043's query leakage guard.
              tree = neighbourhoods.trees.get(example.source)
              if tree is None:
                  raise RuntimeError(
                      f"E046 missing parsed caller file: {HELDOUT}:{example.source}"
                  )
              imports = _cross_file_imports(
                  tree,
                  known_files=neighbourhoods.known_files,
                  importing_file=Path(example.source),
                  by_file=neighbourhoods.by_file,
                  source_roots=neighbourhoods.source_roots,
              )
              target_aliases = [
                  alias for alias, symbol in imports.items()
                  if render_symbol(symbol, body_chars=BODY_CHARS) == wanted
              ]
              if not target_aliases:
                  raise RuntimeError(
                      f"E046 could not reconstruct target import: "
                      f"{HELDOUT}:{example.source}"
                  )
              for alias in target_aliases:
                  if re.search(rf"\b{re.escape(alias)}\b", focused.context):
                      raise RuntimeError(
                          f"E046 alias leakage: {alias} {HELDOUT}:{example.source}"
                      )
              target_name = wanted.splitlines()[0].split("(", 1)[0].strip()
              if re.search(rf"\b{re.escape(target_name)}\b", focused.context):
                  raise RuntimeError(
                      f"E046 target-name leakage: {target_name} "
                      f"{HELDOUT}:{example.source}"
                  )

              # Label-free deterministic priority. The construction never reads
              # answer_index or the target candidate.
              files = label_free_files(example)
              # Explicit invariance guard: relabelling the protocol choice cannot
              # alter the dependency neighbourhood.
              for alternate in range(len(example.candidates)):
                  if label_free_files(replace(example, answer_index=alternate)) != files:
                      raise RuntimeError("E046 neighbourhood depends on hidden label")

              priority_symbols = tuple(
                  symbol
                  for name in files
                  for symbol in neighbourhoods.by_file.get(name, ())
              )
              priority_mask = bindable_mask(
                  example, priority_symbols, body_chars=BODY_CHARS
              )
              priority_bindable = [
                  symbol for symbol, allowed in zip(priority_symbols, priority_mask)
                  if allowed
              ]
              priority_distinct, _ = distinct_by_rendering(
                  priority_bindable, body_chars=BODY_CHARS
              )
              priority_texts = frozenset(
                  render_symbol(symbol, body_chars=BODY_CHARS)
                  for symbol in priority_distinct
              )

              tasks.append({
                  "source_index": index,
                  "source": example.source,
                  "context": focused.context,
                  "candidate_texts": candidate_texts,
                  "target_index": target_index,
                  "pool_size": len(candidate_texts),
                  "priority_texts": priority_texts,
                  "priority_files": len(files),
              })

          if len(tasks) + len(exclusions) != len(examples):
              raise RuntimeError("E046 population accounting drift")
          if exclusions:
              raise RuntimeError(f"E046 unexpected ambiguity exclusions: {exclusions!r}")

          if not tasks:
              summary = {
                  "heldout_repo": HELDOUT,
                  "extracted_tasks": len(examples),
                  "retained_tasks": 0,
                  "ambiguity_exclusions": exclusions,
                  "baseline_rank1": 0,
                  "baseline_hit_at_32": 0,
                  "hybrid_rank1": 0,
                  "hybrid_hit_at_32": 0,
              }
              path = f"/tmp/e046-{HELDOUT}.json"
              with open(path, "w", encoding="utf-8") as handle:
                  json.dump(
                      {"summary": summary, "records": []},
                      handle, indent=2, sort_keys=True
                  )
              print("E046_FOLD=" + json.dumps(summary, sort_keys=True))
              raise SystemExit(0)

          unique_candidates = []
          seen_candidates = set()
          unique_contexts = []
          seen_contexts = set()
          for task in tasks:
              for text in task["candidate_texts"]:
                  if text not in seen_candidates:
                      seen_candidates.add(text)
                      unique_candidates.append(text)
              if task["context"] not in seen_contexts:
                  seen_contexts.add(task["context"])
                  unique_contexts.append(task["context"])

          encoder = CodeRankEncoder(max_length=512, normalize_embeddings=False)

          def encode_batched(texts, role, batch_size=32):
              chunks = []
              for start in range(0, len(texts), batch_size):
                  batch = texts[start:start + batch_size]
                  chunks.append(
                      encoder.encode_role(batch, role=role).detach().cpu()
                  )
              return torch.cat(chunks, dim=0)

          candidate_embeddings = F.normalize(
              encode_batched(unique_candidates, "candidate").float(), dim=-1
          )
          context_embeddings = F.normalize(
              encode_batched(unique_contexts, "context").float(), dim=-1
          )
          candidate_index = {text: i for i, text in enumerate(unique_candidates)}
          context_index = {text: i for i, text in enumerate(unique_contexts)}

          records = []
          for task in tasks:
              ids = [candidate_index[text] for text in task["candidate_texts"]]
              q = context_embeddings[context_index[task["context"]]]
              c = candidate_embeddings[ids]
              scores = torch.mv(c, q).tolist()

              baseline = sorted(
                  range(len(scores)),
                  key=lambda i: (-scores[i], i),
              )
              hybrid = sorted(
                  range(len(scores)),
                  key=lambda i: (
                      0 if task["candidate_texts"][i] in task["priority_texts"] else 1,
                      -scores[i],
                      i,
                  ),
              )

              baseline_rank = baseline.index(task["target_index"]) + 1
              hybrid_rank = hybrid.index(task["target_index"]) + 1
              cutoff = min(SHORTLIST, task["pool_size"])
              priority_size = sum(
                  text in task["priority_texts"]
                  for text in task["candidate_texts"]
              )
              records.append({
                  "repo": HELDOUT,
                  "source_index": task["source_index"],
                  "source": task["source"],
                  "pool_size": task["pool_size"],
                  "priority_files": task["priority_files"],
                  "priority_size": priority_size,
                  "target_in_priority": (
                      task["candidate_texts"][task["target_index"]]
                      in task["priority_texts"]
                  ),
                  "baseline_rank": baseline_rank,
                  "hybrid_rank": hybrid_rank,
                  "baseline_rank1": baseline_rank == 1,
                  "hybrid_rank1": hybrid_rank == 1,
                  "baseline_hit_at_32": baseline_rank <= cutoff,
                  "hybrid_hit_at_32": hybrid_rank <= cutoff,
              })

          summary = {
              "heldout_repo": HELDOUT,
              "extracted_tasks": len(examples),
              "retained_tasks": len(records),
              "ambiguity_exclusions": exclusions,
              "baseline_rank1": sum(r["baseline_rank1"] for r in records),
              "baseline_hit_at_32": sum(r["baseline_hit_at_32"] for r in records),
              "hybrid_rank1": sum(r["hybrid_rank1"] for r in records),
              "hybrid_hit_at_32": sum(r["hybrid_hit_at_32"] for r in records),
              "baseline_misses_rescued": sum(
                  (not r["baseline_hit_at_32"]) and r["hybrid_hit_at_32"]
                  for r in records
              ),
              "baseline_hits_displaced": sum(
                  r["baseline_hit_at_32"] and (not r["hybrid_hit_at_32"])
                  for r in records
              ),
              "tasks_with_priority_candidates": sum(
                  r["priority_size"] > 0 for r in records
              ),
              "target_in_priority": sum(
                  r["target_in_priority"] for r in records
              ),
          }

          path = f"/tmp/e046-{HELDOUT}.json"
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(
                  {"summary": summary, "records": records},
                  handle, indent=2, sort_keys=True
              )
          print("E046_FOLD=" + json.dumps(summary, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: e046-${{ matrix.heldout }}
          path: /tmp/e046-${{ matrix.heldout }}.json

  aggregate:
    needs: retrieve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: e046-*
          path: /tmp/e046
          merge-multiple: true
      - name: Aggregate label-free retrieval folds
        run: |
          python - <<'PY'
          import glob
          import json
          import math
          import random
          import statistics
          from collections import Counter, defaultdict

          EXPECTED_TASKS = {
              "alphafold": 0,
              "pyodide": 3,
              "optuna": 187,
              "pytest": 75,
          }
          EXPECTED_BASELINE_RANK1 = 122
          EXPECTED_BASELINE_HIT32 = 224
          BOOTSTRAPS = 5000
          SEED = 46046

          folds = []
          records = []
          exclusions = []
          for path in sorted(glob.glob("/tmp/e046/e046-*.json")):
              with open(path, encoding="utf-8") as handle:
                  payload = json.load(handle)
              folds.append(payload["summary"])
              records.extend(payload["records"])
              exclusions.extend(
                  {"repo": payload["summary"]["heldout_repo"], **row}
                  for row in payload["summary"]["ambiguity_exclusions"]
              )

          if len(folds) != 4:
              raise RuntimeError(f"expected four E046 folds, got {len(folds)}")
          counts = {f["heldout_repo"]: f["retained_tasks"] for f in folds}
          if counts != EXPECTED_TASKS:
              raise RuntimeError(f"E046 retained-count drift: {counts!r}")
          if exclusions:
              raise RuntimeError(f"E046 unexpected ambiguity exclusions: {exclusions!r}")
          if len(records) != 265:
              raise RuntimeError(f"E046 total drift: {len(records)} != 265")

          baseline_rank1 = sum(r["baseline_rank1"] for r in records)
          baseline_hits = sum(r["baseline_hit_at_32"] for r in records)
          if baseline_rank1 != EXPECTED_BASELINE_RANK1:
              raise RuntimeError(
                  f"E043 rank-1 continuity drift: {baseline_rank1} "
                  f"!= {EXPECTED_BASELINE_RANK1}"
              )
          if baseline_hits != EXPECTED_BASELINE_HIT32:
              raise RuntimeError(
                  f"E043 recall@32 continuity drift: {baseline_hits} "
                  f"!= {EXPECTED_BASELINE_HIT32}"
              )

          hybrid_hits = sum(r["hybrid_hit_at_32"] for r in records)
          hybrid_rank1 = sum(r["hybrid_rank1"] for r in records)
          rescued = sum(
              (not r["baseline_hit_at_32"]) and r["hybrid_hit_at_32"]
              for r in records
          )
          displaced = sum(
              r["baseline_hit_at_32"] and (not r["hybrid_hit_at_32"])
              for r in records
          )
          discordant = rescued + displaced
          if discordant:
              k = min(rescued, displaced)
              tail = sum(math.comb(discordant, i) for i in range(k + 1)) / (2 ** discordant)
              mcnemar_p = min(1.0, 2.0 * tail)
          else:
              mcnemar_p = 1.0

          groups = defaultdict(lambda: defaultdict(list))
          for row in records:
              groups[row["repo"]][row["source"]].append(row)

          def percentile(values, q):
              xs = sorted(values)
              pos = (len(xs) - 1) * q
              lo = int(math.floor(pos))
              hi = int(math.ceil(pos))
              if lo == hi:
                  return xs[lo]
              w = pos - lo
              return xs[lo] * (1 - w) + xs[hi] * w

          rng = random.Random(SEED)
          boots = []
          for _ in range(BOOTSTRAPS):
              sample = []
              for repo in sorted(groups):
                  sources = sorted(groups[repo])
                  for _ in range(len(sources)):
                      source = rng.choice(sources)
                      sample.extend(groups[repo][source])
              boots.append(statistics.mean(
                  float(r["hybrid_hit_at_32"])
                  - float(r["baseline_hit_at_32"])
                  for r in sample
              ))
          ci = [percentile(boots, .025), percentile(boots, .975)]

          per_repo = {}
          for repo in sorted(groups):
              rows = [r for r in records if r["repo"] == repo]
              per_repo[repo] = {
                  "n": len(rows),
                  "baseline_hit_at_32": sum(r["baseline_hit_at_32"] for r in rows),
                  "hybrid_hit_at_32": sum(r["hybrid_hit_at_32"] for r in rows),
                  "baseline_rank1": sum(r["baseline_rank1"] for r in rows),
                  "hybrid_rank1": sum(r["hybrid_rank1"] for r in rows),
                  "priority_present": sum(r["priority_size"] > 0 for r in rows),
                  "target_in_priority": sum(r["target_in_priority"] for r in rows),
              }

          def priority_split(predicate):
              rows = [r for r in records if predicate(r)]
              return {
                  "n": len(rows),
                  "baseline_hit_at_32": sum(r["baseline_hit_at_32"] for r in rows),
                  "hybrid_hit_at_32": sum(r["hybrid_hit_at_32"] for r in rows),
                  "target_in_priority": sum(r["target_in_priority"] for r in rows),
              }

          report = {
              "protocol": "E046 label-free import-neighbourhood priority + CodeRank top-32",
              "tasks": len(records),
              "baseline_rank1": baseline_rank1,
              "baseline_hit_at_32": baseline_hits,
              "baseline_recall_at_32": baseline_hits / len(records),
              "hybrid_rank1": hybrid_rank1,
              "hybrid_hit_at_32": hybrid_hits,
              "hybrid_recall_at_32": hybrid_hits / len(records),
              "paired_recall_delta": (hybrid_hits - baseline_hits) / len(records),
              "baseline_misses_rescued": rescued,
              "baseline_hits_displaced": displaced,
              "mcnemar_exact_p": mcnemar_p,
              "cluster_bootstrap_95ci_paired_delta": ci,
              "bootstrap_replicates": BOOTSTRAPS,
              "bootstrap_seed": SEED,
              "tasks_with_priority_candidates": sum(
                  r["priority_size"] > 0 for r in records
              ),
              "target_in_priority": sum(
                  r["target_in_priority"] for r in records
              ),
              "priority_size": {
                  "mean": statistics.mean(r["priority_size"] for r in records),
                  "median": statistics.median(r["priority_size"] for r in records),
                  "max": max(r["priority_size"] for r in records),
                  "histogram": dict(sorted(Counter(r["priority_size"] for r in records).items())),
              },
              "hybrid_target_rank_histogram": dict(sorted(Counter(
                  r["hybrid_rank"] for r in records
              ).items())),
              "hybrid_mrr": statistics.mean(1.0 / r["hybrid_rank"] for r in records),
              "per_repo": per_repo,
              "priority_size_le_32": priority_split(lambda r: r["priority_size"] <= 32),
              "priority_size_gt_32": priority_split(lambda r: r["priority_size"] > 32),
              "folds": sorted(folds, key=lambda f: f["heldout_repo"]),
          }
          report["primary_gate"] = {
              "hybrid_hits_gt_224": hybrid_hits > EXPECTED_BASELINE_HIT32,
              "mcnemar_p_lt_0_05": mcnemar_p < 0.05,
              "cluster_lower_delta_gt_zero": ci[0] > 0.0,
          }
          report["primary_gate"]["passed"] = all(report["primary_gate"].values())
          report["continuation"] = (
              "freeze_dependency_priority_for_next_selection_test"
              if report["primary_gate"]["passed"]
              else "stop_import_neighbourhood_priority"
          )

          with open("/tmp/e046-aggregate.json", "w", encoding="utf-8") as handle:
              json.dump(
                  {"summary": report, "records": records},
                  handle, indent=2, sort_keys=True
              )
          print("E046_AGGREGATE=" + json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: e046-aggregate
          path: /tmp/e046-aggregate.json
