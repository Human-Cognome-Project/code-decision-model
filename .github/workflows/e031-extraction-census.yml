name: e031-extraction-census

on:
  push:
    branches: ["analysis/e031-extraction-census"]

jobs:
  census:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {order: 1, name: alphafold, repo: google-deepmind/alphafold, sha: c77e5d2a8961d1a353632c462914ff0a32a950f6}
          - {order: 2, name: pyodide, repo: pyodide/pyodide, sha: e4d3ae954d01d61a3e90531d63b881f2d33361b4}
          - {order: 3, name: optuna, repo: optuna/optuna, sha: 7d08bfa1824606d7caedb80abfd8558bc63826d7}
          - {order: 4, name: pytest, repo: pytest-dev/pytest, sha: 6a9ba0f02f827a54cff6ab4da0dddecd65444ff6}
          - {order: 5, name: yapf, repo: google/yapf, sha: 12005095296072751e3e4c1f33a047d41b0ce18d}
          - {order: 6, name: stable-baselines3, repo: DLR-RM/stable-baselines3, sha: 7cfb4dd6055e74b5caa4ed4d6777492209946e26}
          - {order: 7, name: redis-py, repo: redis/redis-py, sha: 2fdaaa32b5fcf767dfa557c86e7d050567597e3f}
          - {order: 8, name: pelican, repo: getpelican/pelican, sha: 3c69dc68d25a761911697467c765a16e68915c74}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: python -m pip install -e . --no-deps
      - name: Clone pinned candidate
        env:
          REPO: ${{ matrix.repo }}
          SHA: ${{ matrix.sha }}
        run: |
          git clone --filter=blob:none --no-checkout "https://github.com/$REPO.git" /tmp/candidate
          git -C /tmp/candidate fetch --depth 1 origin "$SHA"
          git -C /tmp/candidate checkout --detach "$SHA"
      - name: Extract frozen E027 task census
        env:
          ORDER: ${{ matrix.order }}
          NAME: ${{ matrix.name }}
          REPO: ${{ matrix.repo }}
          SHA: ${{ matrix.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from cdm.methods import repository_hard_masked_method_call_examples
          from cdm.repository import repository_hard_masked_call_examples

          root = "/tmp/candidate"
          funcs = repository_hard_masked_call_examples(
              root, candidate_count=4, candidate_body_chars=512, seed=0
          )
          methods = repository_hard_masked_method_call_examples(
              root, candidate_count=4, candidate_body_chars=512, seed=0
          )
          sources = {e.source for e in [*funcs, *methods] if e.source is not None}
          row = {
              "order": int(os.environ["ORDER"]),
              "name": os.environ["NAME"],
              "repository": os.environ["REPO"],
              "sha": os.environ["SHA"],
              "functions": len(funcs),
              "methods": len(methods),
              "total": len(funcs) + len(methods),
              "source_files": len(sources),
          }
          row["eligible"] = row["total"] >= 25 and row["source_files"] >= 5
          path = f"/tmp/e031-{row['order']:02d}-{row['name']}.json"
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(row, handle, indent=2, sort_keys=True)
          print("E031_CENSUS=" + json.dumps(row, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: e031-census-${{ matrix.order }}-${{ matrix.name }}
          path: /tmp/e031-*.json

  aggregate:
    needs: census
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: e031-census-*
          path: /tmp/e031
          merge-multiple: true
      - name: Apply preregistered selection rule
        run: |
          python - <<'PY'
          import glob
          import json

          rows = []
          for path in glob.glob("/tmp/e031/e031-*.json"):
              with open(path, encoding="utf-8") as handle:
                  rows.append(json.load(handle))
          rows.sort(key=lambda row: row["order"])
          eligible = [row for row in rows if row["eligible"]]
          selected = eligible[:4]
          report = {
              "candidate_count": len(rows),
              "eligible_count": len(eligible),
              "enough_eligible": len(eligible) >= 4,
              "selected": selected,
              "candidates": rows,
              "rule": {
                  "minimum_total_examples": 25,
                  "minimum_source_files": 5,
                  "selection": "first four eligible in frozen candidate-pool order",
              },
          }
          with open("/tmp/e031-extraction-selection.json", "w", encoding="utf-8") as handle:
              json.dump(report, handle, indent=2, sort_keys=True)
          print("E031_SELECTION=" + json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: e031-extraction-selection
          path: /tmp/e031-extraction-selection.json
