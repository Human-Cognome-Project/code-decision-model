name: e025-confirmatory-structured-edit

on:
  push:
    branches: ["analysis/e025-confirmatory-structured-edit"]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: e025-qwen05-coderank-${{ runner.os }}-py312-v1
      - run: python -m pip install --upgrade pip
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install model dependencies
        run: python -m pip install -e ".[hf,coderank]"
      - name: Clone exact benchmark revisions
        run: |
          set -e
          clone_at () {
            url="$1"
            sha="$2"
            dest="$3"
            git clone --filter=blob:none --no-checkout "$url" "$dest"
            git -C "$dest" fetch --depth 1 origin "$sha"
            git -C "$dest" checkout --detach "$sha"
          }
          mkdir -p /tmp/recent
          clone_at https://github.com/browser-use/browser-use.git d8110c5ff87ccba887aaa726cdb780f2f84bef8d /tmp/recent/browser-use
          clone_at https://github.com/unclecode/crawl4ai.git 862f6bccb9c063f49b9d42701baa0eea17a4993f /tmp/recent/crawl4ai
          clone_at https://github.com/microsoft/markitdown.git b8f79c57ebc0044be41323d89b2a45d3fda8460e /tmp/recent/markitdown
          clone_at https://github.com/D4Vinci/Scrapling.git 08f107b1240fd72847b0f5e10426c7e6cc16e67e /tmp/recent/scrapling
      - name: Run full held-out structured-edit confirmation
        run: |
          python - <<'PY'
          import gc
          import json
          import math
          import random
          import re
          import statistics
          import time
          from collections import Counter, defaultdict

          import torch
          from transformers import AutoModelForCausalLM, AutoTokenizer

          from cdm import CodeDecisionModel, CodeRankEncoder, PairwiseMLPScorer
          from cdm.focus import focus_hard_call_context
          from cdm.methods import repository_hard_masked_method_call_examples
          from cdm.repository import (
              namespace_repository_examples,
              repository_hard_masked_call_examples,
              split_repository_examples_by_namespace,
          )
          from cdm.training import collate_encoded_examples, preencode_examples

          REPOS = {
              "browser-use": "/tmp/recent/browser-use",
              "crawl4ai": "/tmp/recent/crawl4ai",
              "markitdown": "/tmp/recent/markitdown",
              "scrapling": "/tmp/recent/scrapling",
          }
          MODEL_ID = "Qwen/Qwen2.5-Coder-0.5B-Instruct"
          MODEL_REVISION = "ea3f2471cf1b1f0db85067f1ef93848e38e88c25"
          K = 4
          BODY_CHARS = 512
          MAX_ATTEMPTS = 2
          BOOTSTRAPS = 5000

          def repo_of(example):
              return example.source.split("::", 1)[0]

          def task_kind(example):
              return "method" if "same_class" in example.task else "function"

          pooled = []
          extraction = {}
          for name, root in REPOS.items():
              funcs = repository_hard_masked_call_examples(
                  root,
                  candidate_count=K,
                  candidate_body_chars=BODY_CHARS,
                  seed=0,
              )
              methods = repository_hard_masked_method_call_examples(
                  root,
                  candidate_count=K,
                  candidate_body_chars=BODY_CHARS,
                  seed=0,
              )
              extraction[name] = {
                  "functions": len(funcs),
                  "methods": len(methods),
              }
              pooled.extend(namespace_repository_examples(funcs, name))
              pooled.extend(namespace_repository_examples(methods, name))

          dataset = split_repository_examples_by_namespace(
              pooled,
              seed=0,
              train_fraction=0.70,
              validation_fraction=0.15,
              small_namespace="train",
          )

          train_focus = [
              focus_hard_call_context(e, radius_lines=0)
              for e in dataset.train
          ]
          test_focus = [
              focus_hard_call_context(e, radius_lines=0)
              for e in dataset.test
          ]

          encoder = CodeRankEncoder(
              max_length=512,
              normalize_embeddings=False,
          )
          shell = CodeDecisionModel(
              encoder=encoder,
              dim=encoder.dim,
              scorer=PairwiseMLPScorer(encoder.dim, hidden=32),
          )
          encoded = preencode_examples(
              shell,
              [*train_focus, *test_focus],
              batch_size=8,
          )
          n_train = len(train_focus)
          encoded_train = encoded[:n_train]
          encoded_test = encoded[n_train:]

          torch.manual_seed(2)
          shell.scorer = PairwiseMLPScorer(encoder.dim, hidden=32)
          optimizer = torch.optim.AdamW(
              shell.scorer.parameters(),
              lr=1e-3,
              weight_decay=1e-2,
          )
          order = torch.randperm(
              len(encoded_train),
              generator=torch.Generator().manual_seed(20001),
          ).tolist()
          shell.scorer.train()
          for start in range(0, len(order), 32):
              ids = order[start:start + 32]
              batch = collate_encoded_examples(
                  [encoded_train[i] for i in ids]
              )
              optimizer.zero_grad(set_to_none=True)
              logits = shell.score_encoded_batch(
                  batch.contexts,
                  batch.questions,
                  batch.candidate_embeddings,
              )
              loss = torch.nn.functional.cross_entropy(
                  logits,
                  batch.targets,
              )
              loss.backward()
              torch.nn.utils.clip_grad_norm_(
                  shell.scorer.parameters(),
                  1.0,
              )
              optimizer.step()

          shell.scorer.eval()
          recommendations = []
          with torch.no_grad():
              for item in encoded_test:
                  recommendations.append(
                      int(
                          shell.score_encoded(
                              item.decision_context,
                              item.candidate_embeddings,
                          ).argmax()
                      )
                  )

          test_decision_accuracy = sum(
              pred == example.answer_index
              for pred, example in zip(recommendations, dataset.test)
          ) / len(dataset.test)

          del encoded_train, encoded_test, encoded, shell, encoder, optimizer
          gc.collect()

          tokenizer = AutoTokenizer.from_pretrained(
              MODEL_ID,
              revision=MODEL_REVISION,
          )
          model = AutoModelForCausalLM.from_pretrained(
              MODEL_ID,
              revision=MODEL_REVISION,
              torch_dtype=torch.float32,
          )
          model.eval()

          def prompt_for(example, recommendation, feedback):
              blocks = [
                  "Choose the one candidate that should replace __CALL_TARGET__.",
                  (
                      "Return only one digit: 1, 2, 3, or 4. "
                      "Do not return code or explanation."
                  ),
                  "Caller:\n" + example.context,
              ]
              for i, candidate in enumerate(example.candidates):
                  blocks.append(
                      f"Candidate {i + 1}:\n{candidate}"
                  )
              if recommendation is not None:
                  blocks.append(
                      "Repository decision evidence (fallible): "
                      f"candidate {recommendation + 1} is recommended."
                  )
              if feedback:
                  blocks.append(feedback)
              return "\n\n".join(blocks)

          choice_re = re.compile(
              r"^(?:candidate\s*)?([1-4])(?:[.)]?)$",
              re.IGNORECASE,
          )

          def generate_choice(prompt):
              messages = [
                  {
                      "role": "system",
                      "content": (
                          "You are a precise code decision engine. "
                          "Answer only with the requested candidate digit."
                      ),
                  },
                  {"role": "user", "content": prompt},
              ]
              rendered = tokenizer.apply_chat_template(
                  messages,
                  tokenize=False,
                  add_generation_prompt=True,
              )
              inputs = tokenizer(rendered, return_tensors="pt")
              t0 = time.perf_counter()
              with torch.inference_mode():
                  output = model.generate(
                      **inputs,
                      max_new_tokens=8,
                      do_sample=False,
                      num_beams=1,
                      pad_token_id=tokenizer.eos_token_id,
                      eos_token_id=tokenizer.eos_token_id,
                  )
              seconds = time.perf_counter() - t0
              generated = output[
                  0,
                  inputs["input_ids"].shape[-1]:,
              ]
              text = tokenizer.decode(
                  generated,
                  skip_special_tokens=True,
              ).strip()
              return text, seconds

          def run_arm(example, recommendation):
              attempts = []
              feedback = None
              for _ in range(MAX_ATTEMPTS):
                  raw, seconds = generate_choice(
                      prompt_for(example, recommendation, feedback)
                  )
                  match = choice_re.fullmatch(raw.strip())
                  if match is None:
                      attempts.append({
                          "raw": raw,
                          "parsed": None,
                          "correct": False,
                          "reason": "invalid_choice_format",
                          "seconds": seconds,
                      })
                      feedback = (
                          "Invalid format. Return only one digit: "
                          "1, 2, 3, or 4."
                      )
                      continue
                  choice = int(match.group(1)) - 1
                  correct = choice == example.answer_index
                  attempts.append({
                      "raw": raw,
                      "parsed": choice,
                      "correct": correct,
                      "reason": "ok" if correct else "wrong_target",
                      "seconds": seconds,
                  })
                  if correct:
                      break
                  feedback = (
                      "That candidate violates the repository constraint. "
                      "Choose another candidate number."
                  )
              return {
                  "success": bool(attempts and attempts[-1]["correct"]),
                  "attempts": len(attempts),
                  "correction_turns": max(0, len(attempts) - 1),
                  "first_pass": bool(attempts and attempts[0]["correct"]),
                  "trace": attempts,
              }

          records = []
          for example, recommendation in zip(
              dataset.test,
              recommendations,
          ):
              baseline = run_arm(example, None)
              assisted = run_arm(example, recommendation)
              records.append({
                  "repo": repo_of(example),
                  "task": task_kind(example),
                  "source": example.source,
                  "answer_index": example.answer_index,
                  "recommendation_index": recommendation,
                  "recommendation_correct": (
                      recommendation == example.answer_index
                  ),
                  "baseline": baseline,
                  "assisted": assisted,
              })

          def condition_summary(name, rows=records):
              arms = [r[name] for r in rows]
              successes = [r for r in arms if r["success"]]
              return {
                  "n": len(arms),
                  "successes": sum(r["success"] for r in arms),
                  "success_rate": (
                      sum(r["success"] for r in arms) / len(arms)
                  ),
                  "first_pass_successes": sum(
                      r["first_pass"] for r in arms
                  ),
                  "first_pass_rate": (
                      sum(r["first_pass"] for r in arms) / len(arms)
                  ),
                  "terminal_failures": sum(
                      not r["success"] for r in arms
                  ),
                  "mean_attempts_all": statistics.mean(
                      r["attempts"] for r in arms
                  ),
                  "mean_corrections_successful": (
                      statistics.mean(
                          r["correction_turns"] for r in successes
                      )
                      if successes else None
                  ),
                  "invalid_format_attempts": sum(
                      a["reason"] == "invalid_choice_format"
                      for r in arms
                      for a in r["trace"]
                  ),
                  "generation_seconds": sum(
                      a["seconds"]
                      for r in arms
                      for a in r["trace"]
                  ),
              }

          def paired_summary(rows):
              both = [
                  r for r in rows
                  if r["baseline"]["success"]
                  and r["assisted"]["success"]
              ]
              deltas = [
                  r["baseline"]["correction_turns"]
                  - r["assisted"]["correction_turns"]
                  for r in both
              ]
              assisted_only = sum(
                  r["assisted"]["success"]
                  and not r["baseline"]["success"]
                  for r in rows
              )
              baseline_only = sum(
                  r["baseline"]["success"]
                  and not r["assisted"]["success"]
                  for r in rows
              )
              discordant = assisted_only + baseline_only
              if discordant:
                  tail = sum(
                      math.comb(discordant, k)
                      for k in range(
                          0,
                          min(assisted_only, baseline_only) + 1,
                      )
                  ) / (2 ** discordant)
                  mcnemar_p = min(1.0, 2.0 * tail)
              else:
                  mcnemar_p = 1.0
              return {
                  "both_success": len(both),
                  "assisted_only": assisted_only,
                  "baseline_only": baseline_only,
                  "neither": sum(
                      not r["baseline"]["success"]
                      and not r["assisted"]["success"]
                      for r in rows
                  ),
                  "success_rate_delta": (
                      sum(r["assisted"]["success"] for r in rows)
                      - sum(r["baseline"]["success"] for r in rows)
                  ) / len(rows),
                  "first_pass_rate_delta": (
                      sum(r["assisted"]["first_pass"] for r in rows)
                      - sum(r["baseline"]["first_pass"] for r in rows)
                  ) / len(rows),
                  "mcnemar_exact_two_sided_p": mcnemar_p,
                  "mean_correction_turn_delta_both_success": (
                      statistics.mean(deltas) if deltas else None
                  ),
                  "fewer_corrections_assisted": sum(
                      d > 0 for d in deltas
                  ),
                  "same_corrections": sum(
                      d == 0 for d in deltas
                  ),
                  "more_corrections_assisted": sum(
                      d < 0 for d in deltas
                  ),
              }

          by_repo = {}
          for repo in sorted(REPOS):
              rows = [r for r in records if r["repo"] == repo]
              by_repo[repo] = {
                  "baseline": condition_summary("baseline", rows),
                  "assisted": condition_summary("assisted", rows),
                  "paired": paired_summary(rows),
              }

          by_task = {}
          for task in ("function", "method"):
              rows = [r for r in records if r["task"] == task]
              by_task[task] = {
                  "baseline": condition_summary("baseline", rows),
                  "assisted": condition_summary("assisted", rows),
                  "paired": paired_summary(rows),
              }

          groups = defaultdict(lambda: defaultdict(list))
          for r in records:
              groups[r["repo"]][r["source"]].append(r)

          rng = random.Random(25023)
          boot_success = []
          boot_first = []
          for _ in range(BOOTSTRAPS):
              sample = []
              for repo in sorted(groups):
                  sources = sorted(groups[repo])
                  for _ in range(len(sources)):
                      source = rng.choice(sources)
                      sample.extend(groups[repo][source])
              boot_success.append(
                  (
                      sum(r["assisted"]["success"] for r in sample)
                      - sum(r["baseline"]["success"] for r in sample)
                  ) / len(sample)
              )
              boot_first.append(
                  (
                      sum(r["assisted"]["first_pass"] for r in sample)
                      - sum(r["baseline"]["first_pass"] for r in sample)
                  ) / len(sample)
              )

          def percentile(values, q):
              xs = sorted(values)
              pos = (len(xs) - 1) * q
              lo = int(math.floor(pos))
              hi = int(math.ceil(pos))
              if lo == hi:
                  return xs[lo]
              w = pos - lo
              return xs[lo] * (1 - w) + xs[hi] * w

          report = {
              "model": MODEL_ID,
              "revision": MODEL_REVISION,
              "decoding": {
                  "max_attempts": MAX_ATTEMPTS,
                  "max_new_tokens": 8,
                  "do_sample": False,
                  "num_beams": 1,
                  "strict_fullmatch_parser": True,
              },
              "corpus": {
                  "total": len(pooled),
                  "train": len(dataset.train),
                  "validation": len(dataset.validation),
                  "test": len(dataset.test),
                  "test_by_repo": dict(
                      Counter(repo_of(e) for e in dataset.test)
                  ),
                  "test_by_task": dict(
                      Counter(task_kind(e) for e in dataset.test)
                  ),
                  "extraction": extraction,
              },
              "decision_intervention": {
                  "encoder": "nomic-ai/CodeRankEmbed",
                  "scorer": "PairwiseMLPScorer(hidden=32)",
                  "seed": 2,
                  "epochs": 1,
                  "test_accuracy": test_decision_accuracy,
              },
              "baseline": condition_summary("baseline"),
              "assisted": condition_summary("assisted"),
              "paired": paired_summary(records),
              "paired_cluster_bootstrap_95ci": {
                  "replicates": BOOTSTRAPS,
                  "unit": "source file within repository",
                  "success_rate_delta": [
                      percentile(boot_success, 0.025),
                      percentile(boot_success, 0.975),
                  ],
                  "first_pass_rate_delta": [
                      percentile(boot_first, 0.025),
                      percentile(boot_first, 0.975),
                  ],
              },
              "by_repo": by_repo,
              "by_task": by_task,
          }

          with open("/tmp/e025-records.json", "w", encoding="utf-8") as handle:
              json.dump(
                  {"summary": report, "records": records},
                  handle,
                  indent=2,
                  sort_keys=True,
              )

          print("E025_CONFIRMATORY_JSON=" + json.dumps(report, sort_keys=True))
          PY
      - name: Upload detailed records
        uses: actions/upload-artifact@v4
        with:
          name: e025-confirmatory-records
          path: /tmp/e025-records.json
