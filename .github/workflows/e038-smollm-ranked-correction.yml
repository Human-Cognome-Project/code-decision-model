name: e038-smollm-ranked-correction

on:
  push:
    branches: ["analysis/e038-smollm-ranked-correction-live"]

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        heldout: [alphafold, pyodide, optuna, pytest]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: e037-smollm2-360m-coderank-${{ runner.os }}-py312-v1
      - run: python -m pip install --upgrade pip
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install model dependencies
        run: python -m pip install -e ".[hf,coderank]"
      - name: Download preserved E037 aggregate
        uses: actions/download-artifact@v4
        with:
          name: e037-aggregate
          path: /tmp/e038-history
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35855513250
      - name: Clone exact E031 revisions
        run: |
          set -e
          clone_at () {
            url="$1"
            sha="$2"
            dest="$3"
            git clone --filter=blob:none --no-checkout "$url" "$dest"
            git -C "$dest" fetch --depth 1 origin "$sha"
            git -C "$dest" checkout --detach "$sha"
          }
          mkdir -p /tmp/e038-repos
          clone_at https://github.com/google-deepmind/alphafold.git c77e5d2a8961d1a353632c462914ff0a32a950f6 /tmp/e038-repos/alphafold
          clone_at https://github.com/pyodide/pyodide.git e4d3ae954d01d61a3e90531d63b881f2d33361b4 /tmp/e038-repos/pyodide
          clone_at https://github.com/optuna/optuna.git 7d08bfa1824606d7caedb80abfd8558bc63826d7 /tmp/e038-repos/optuna
          clone_at https://github.com/pytest-dev/pytest.git 6a9ba0f02f827a54cff6ab4da0dddecd65444ff6 /tmp/e038-repos/pytest
      - name: Run conditional ranked-correction fold
        env:
          HELDOUT_REPO: ${{ matrix.heldout }}
        run: |
          python - <<'PY'
          import gc
          import glob
          import json
          import os
          import re
          import time

          import torch
          from transformers import AutoModelForCausalLM, AutoTokenizer

          from cdm import CodeDecisionModel, CodeRankEncoder, PairwiseMLPScorer
          from cdm.binding import CallSiteBindable
          from cdm.focus import focus_hard_call_context
          from cdm.methods import repository_hard_masked_method_call_examples
          from cdm.repository import (
              namespace_repository_examples,
              repository_hard_masked_call_examples,
          )
          from cdm.training import collate_encoded_examples, preencode_examples

          REPOS = {
              "alphafold": "/tmp/e038-repos/alphafold",
              "pyodide": "/tmp/e038-repos/pyodide",
              "optuna": "/tmp/e038-repos/optuna",
              "pytest": "/tmp/e038-repos/pytest",
          }
          EXPECTED = {
              "alphafold": {
                  "functions": 23, "methods": 3, "test": 26,
                  "top1": 11, "eligible": 6, "eligible_sources": 4,
              },
              "pyodide": {
                  "functions": 34, "methods": 19, "test": 53,
                  "top1": 36, "eligible": 9, "eligible_sources": 7,
              },
              "optuna": {
                  "functions": 79, "methods": 55, "test": 134,
                  "top1": 87, "eligible": 20, "eligible_sources": 11,
              },
              "pytest": {
                  "functions": 86, "methods": 122, "test": 208,
                  "top1": 110, "eligible": 42, "eligible_sources": 23,
              },
          }
          HELDOUT = os.environ["HELDOUT_REPO"]
          MODEL_ID = "HuggingFaceTB/SmolLM2-360M-Instruct"
          MODEL_REVISION = "cbcad7f4d160a10174f725b968ab6faf2a76399e"
          K = 4
          BODY_CHARS = 512

          def repo_of(example):
              return example.source.split("::", 1)[0]

          def task_kind(example):
              return "method" if "same_class" in example.task else "function"

          pooled = []
          extraction = {}
          for name, root in REPOS.items():
              funcs = repository_hard_masked_call_examples(
                  root, candidate_count=K, candidate_body_chars=BODY_CHARS, seed=0
              )
              methods = repository_hard_masked_method_call_examples(
                  root, candidate_count=K, candidate_body_chars=BODY_CHARS, seed=0
              )
              extraction[name] = {
                  "functions": len(funcs),
                  "methods": len(methods),
              }
              pooled.extend(namespace_repository_examples(funcs, name))
              pooled.extend(namespace_repository_examples(methods, name))

          expected_extraction = {
              name: {
                  "functions": spec["functions"],
                  "methods": spec["methods"],
              }
              for name, spec in EXPECTED.items()
          }
          if extraction != expected_extraction:
              raise RuntimeError(
                  f"E038 extraction drift: {extraction!r} != {expected_extraction!r}"
              )
          if len(pooled) != 421:
              raise RuntimeError(f"E038 task-count drift: {len(pooled)} != 421")

          train_examples = [e for e in pooled if repo_of(e) != HELDOUT]
          test_examples = [e for e in pooled if repo_of(e) == HELDOUT]
          if len(test_examples) != EXPECTED[HELDOUT]["test"]:
              raise RuntimeError(
                  f"test-count drift {HELDOUT}: {len(test_examples)} "
                  f"!= {EXPECTED[HELDOUT]['test']}"
              )

          train_focus = [focus_hard_call_context(e, radius_lines=0) for e in train_examples]
          test_focus = [focus_hard_call_context(e, radius_lines=0) for e in test_examples]

          encoder = CodeRankEncoder(max_length=512, normalize_embeddings=False)
          shell = CodeDecisionModel(
              encoder=encoder,
              dim=encoder.dim,
              scorer=PairwiseMLPScorer(encoder.dim, hidden=32),
          )
          encoded = preencode_examples(
              shell, [*train_focus, *test_focus], batch_size=8
          )
          n_train = len(train_focus)
          encoded_train = encoded[:n_train]
          encoded_test = encoded[n_train:]

          torch.manual_seed(2)
          shell.scorer = PairwiseMLPScorer(encoder.dim, hidden=32)
          optimizer = torch.optim.AdamW(
              shell.scorer.parameters(),
              lr=1e-3,
              weight_decay=1e-2,
          )
          order = torch.randperm(
              len(encoded_train),
              generator=torch.Generator().manual_seed(20001),
          ).tolist()
          shell.scorer.train()
          for start in range(0, len(order), 32):
              ids = order[start:start + 32]
              batch = collate_encoded_examples([encoded_train[i] for i in ids])
              optimizer.zero_grad(set_to_none=True)
              logits = shell.score_encoded_batch(
                  batch.contexts,
                  batch.questions,
                  batch.candidate_embeddings,
              )
              loss = torch.nn.functional.cross_entropy(logits, batch.targets)
              loss.backward()
              torch.nn.utils.clip_grad_norm_(shell.scorer.parameters(), 1.0)
              optimizer.step()

          shell.scorer.eval()
          predicate = CallSiteBindable()
          decisions = []
          with torch.no_grad():
              for example, item in zip(test_examples, encoded_test):
                  scores = shell.score_encoded(
                      item.decision_context,
                      item.candidate_embeddings,
                  )
                  ranking = tuple(
                      sorted(
                          range(len(example.candidates)),
                          key=lambda i: (-float(scores[i]), i),
                      )
                  )
                  allowed = predicate.check(
                      example.context,
                      example.question,
                      example.candidates,
                  ).allowed
                  if not allowed[example.answer_index]:
                      raise RuntimeError(
                          f"E024 soundness failure: {HELDOUT} {example.source}"
                      )
                  decisions.append((example, ranking, allowed))

          top1_correct = sum(
              ranking[0] == example.answer_index
              for example, ranking, _allowed in decisions
          )
          if top1_correct != EXPECTED[HELDOUT]["top1"]:
              raise RuntimeError(
                  f"E031/E037 top1 reproduction drift {HELDOUT}: {top1_correct} "
                  f"!= {EXPECTED[HELDOUT]['top1']}"
              )

          history_paths = glob.glob("/tmp/e038-history/*.json")
          if len(history_paths) != 1:
              raise RuntimeError(
                  f"expected one preserved E037 aggregate, got {history_paths}"
              )
          with open(history_paths[0], encoding="utf-8") as handle:
              historical_all = json.load(handle)["records"]
          historical = [r for r in historical_all if r["repo"] == HELDOUT]
          if len(historical) != len(decisions):
              raise RuntimeError(
                  f"E037 historical row-count drift {HELDOUT}: "
                  f"{len(historical)} != {len(decisions)}"
              )

          def decision_identity(example, ranking):
              return (
                  HELDOUT,
                  example.source,
                  task_kind(example),
                  int(example.answer_index),
                  int(ranking[0]),
              )

          def history_identity(row):
              return (
                  row["repo"],
                  row["source"],
                  row["task"],
                  int(row["answer_index"]),
                  int(row["recommendation_index"]),
              )

          aligned = []
          for i, ((example, ranking, allowed), hist) in enumerate(
              zip(decisions, historical)
          ):
              current_identity = decision_identity(example, ranking)
              frozen_identity = history_identity(hist)
              if current_identity != frozen_identity:
                  raise RuntimeError(
                      f"E037 identity drift {HELDOUT} row {i}: "
                      f"{current_identity!r} != {frozen_identity!r}"
                  )
              current_correct = ranking[0] == example.answer_index
              if bool(hist["recommendation_correct"]) != current_correct:
                  raise RuntimeError(
                      f"E037 recommendation-correct drift {HELDOUT} row {i}"
                  )
              aligned.append((example, ranking, allowed, hist))

          eligible = []
          for example, ranking, allowed, hist in aligned:
              trace = hist["assisted"]["trace"]
              first_parsed = trace[0]["parsed"] if trace else None
              if (
                  not hist["recommendation_correct"]
                  and first_parsed == hist["recommendation_index"]
              ):
                  eligible.append((example, ranking, allowed, hist))

          if len(eligible) != EXPECTED[HELDOUT]["eligible"]:
              raise RuntimeError(
                  f"E038 eligible-count drift {HELDOUT}: {len(eligible)} "
                  f"!= {EXPECTED[HELDOUT]['eligible']}"
              )
          eligible_sources = {example.source for example, *_rest in eligible}
          if len(eligible_sources) != EXPECTED[HELDOUT]["eligible_sources"]:
              raise RuntimeError(
                  f"E038 eligible-source drift {HELDOUT}: "
                  f"{len(eligible_sources)} != "
                  f"{EXPECTED[HELDOUT]['eligible_sources']}"
              )

          del encoded_train, encoded_test, encoded, shell, encoder, optimizer
          gc.collect()

          tokenizer = AutoTokenizer.from_pretrained(
              MODEL_ID, revision=MODEL_REVISION
          )
          model = AutoModelForCausalLM.from_pretrained(
              MODEL_ID,
              revision=MODEL_REVISION,
              torch_dtype=torch.float32,
          )
          model.eval()

          def correction_prompt(example, rejected, recommendation):
              active = [
                  i for i in range(len(example.candidates))
                  if i != rejected
              ]
              allowed_numbers = ", ".join(str(i + 1) for i in active)
              blocks = [
                  "Choose the one candidate that should replace __CALL_TARGET__.",
                  (
                      f"Return only one digit from: {allowed_numbers}. "
                      "Do not return code or explanation."
                  ),
                  "Caller:\n" + example.context,
              ]
              for i in active:
                  blocks.append(f"Candidate {i + 1}:\n{example.candidates[i]}")
              blocks.append(
                  "That candidate violates the repository constraint. "
                  "Choose another candidate number."
              )
              blocks.append(
                  f"Candidate {rejected + 1} was rejected by the deterministic verifier "
                  "and is no longer eligible."
              )
              if recommendation is not None:
                  blocks.append(
                      "Repository decision evidence (fallible): "
                      f"candidate {recommendation + 1} is recommended."
                  )
              return "\n\n".join(blocks)

          choice_re = re.compile(
              r"^(?:candidate\s*)?([1-4])(?:[.)]?)$",
              re.IGNORECASE,
          )

          def generate_choice(prompt):
              messages = [
                  {
                      "role": "system",
                      "content": (
                          "You are a precise code decision engine. "
                          "Answer only with the requested candidate digit."
                      ),
                  },
                  {"role": "user", "content": prompt},
              ]
              rendered = tokenizer.apply_chat_template(
                  messages,
                  tokenize=False,
                  add_generation_prompt=True,
              )
              inputs = tokenizer(rendered, return_tensors="pt")
              t0 = time.perf_counter()
              with torch.inference_mode():
                  output = model.generate(
                      **inputs,
                      max_new_tokens=8,
                      do_sample=False,
                      num_beams=1,
                      pad_token_id=tokenizer.eos_token_id,
                      eos_token_id=tokenizer.eos_token_id,
                  )
              seconds = time.perf_counter() - t0
              generated = output[0, inputs["input_ids"].shape[-1]:]
              text = tokenizer.decode(
                  generated, skip_special_tokens=True
              ).strip()
              match = choice_re.fullmatch(text)
              parsed = int(match.group(1)) - 1 if match else None
              return {
                  "raw": text,
                  "parsed": parsed,
                  "parse_valid": parsed is not None,
                  "seconds": seconds,
              }

          records = []
          for example, ranking, allowed, hist in eligible:
              rejected = ranking[0]
              if rejected != hist["recommendation_index"]:
                  raise RuntimeError(
                      f"rejected-candidate identity drift {HELDOUT} {example.source}"
                  )
              next_rec = next(
                  (
                      index
                      for index in ranking
                      if index != rejected and allowed[index]
                  ),
                  None,
              )
              if next_rec is None:
                  raise RuntimeError(
                      f"no next feasible recommendation: {HELDOUT} {example.source}"
                  )

              memory_prompt_text = correction_prompt(
                  example,
                  rejected,
                  recommendation=None,
              )
              ranked_prompt_text = correction_prompt(
                  example,
                  rejected,
                  recommendation=next_rec,
              )
              suffix = (
                  "\n\nRepository decision evidence (fallible): "
                  f"candidate {next_rec + 1} is recommended."
              )
              if ranked_prompt_text != memory_prompt_text + suffix:
                  raise RuntimeError(
                      "ranked prompt no longer equals E029 prefix plus exact E032 evidence"
                  )

              memory = generate_choice(memory_prompt_text)
              ranked = generate_choice(ranked_prompt_text)
              memory["correct"] = memory["parsed"] == example.answer_index
              ranked["correct"] = ranked["parsed"] == example.answer_index
              ranked["followed_recommendation"] = ranked["parsed"] == next_rec

              records.append({
                  "repo": HELDOUT,
                  "task": task_kind(example),
                  "source": example.source,
                  "answer_index": example.answer_index,
                  "ranking": list(ranking),
                  "allowed": list(allowed),
                  "rejected_recommendation": rejected,
                  "historical_first_parsed": hist["assisted"]["trace"][0]["parsed"],
                  "next_feasible_recommendation": next_rec,
                  "next_feasible_correct": next_rec == example.answer_index,
                  "memory": memory,
                  "ranked": ranked,
              })

          both = sum(
              r["memory"]["correct"] and r["ranked"]["correct"]
              for r in records
          )
          ranked_only = sum(
              r["ranked"]["correct"] and not r["memory"]["correct"]
              for r in records
          )
          memory_only = sum(
              r["memory"]["correct"] and not r["ranked"]["correct"]
              for r in records
          )
          neither = len(records) - both - ranked_only - memory_only

          summary = {
              "heldout_repo": HELDOUT,
              "model": MODEL_ID,
              "revision": MODEL_REVISION,
              "test_examples": len(test_examples),
              "top1_correct": top1_correct,
              "eligible_tasks": len(records),
              "eligible_source_files": len({r["source"] for r in records}),
              "memory_successes": sum(r["memory"]["correct"] for r in records),
              "ranked_successes": sum(r["ranked"]["correct"] for r in records),
              "next_feasible_correct": sum(
                  r["next_feasible_correct"] for r in records
              ),
              "ranked_followed_next_recommendation": sum(
                  r["ranked"]["followed_recommendation"] for r in records
              ),
              "memory_parse_valid": sum(
                  r["memory"]["parse_valid"] for r in records
              ),
              "ranked_parse_valid": sum(
                  r["ranked"]["parse_valid"] for r in records
              ),
              "paired": {
                  "both": both,
                  "ranked_only": ranked_only,
                  "memory_only": memory_only,
                  "neither": neither,
              },
              "by_task": {
                  kind: {
                      "n": sum(r["task"] == kind for r in records),
                      "memory": sum(
                          r["task"] == kind and r["memory"]["correct"]
                          for r in records
                      ),
                      "ranked": sum(
                          r["task"] == kind and r["ranked"]["correct"]
                          for r in records
                      ),
                      "next_feasible_correct": sum(
                          r["task"] == kind and r["next_feasible_correct"]
                          for r in records
                      ),
                  }
                  for kind in ("function", "method")
              },
              "extraction": extraction,
          }

          path = f"/tmp/e038-{HELDOUT}.json"
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(
                  {"summary": summary, "records": records},
                  handle,
                  indent=2,
                  sort_keys=True,
              )
          print("E038_FOLD=" + json.dumps(summary, sort_keys=True))
          PY
      - name: Upload fold records
        uses: actions/upload-artifact@v4
        with:
          name: e038-${{ matrix.heldout }}
          path: /tmp/e038-${{ matrix.heldout }}.json

  aggregate:
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: e038-*
          path: /tmp/e038
          merge-multiple: true
      - name: Aggregate conditional correction transfer
        run: |
          python - <<'PY'
          import glob
          import json
          import math
          import random
          from collections import defaultdict

          EXPECTED = {
              "alphafold": {"eligible": 6, "sources": 4},
              "pyodide": {"eligible": 9, "sources": 7},
              "optuna": {"eligible": 20, "sources": 11},
              "pytest": {"eligible": 42, "sources": 23},
          }
          folds = []
          records = []
          for path in sorted(glob.glob("/tmp/e038/e038-*.json")):
              with open(path, encoding="utf-8") as handle:
                  payload = json.load(handle)
              folds.append(payload["summary"])
              records.extend(payload["records"])

          if len(folds) != 4:
              raise RuntimeError(f"expected 4 folds, got {len(folds)}")
          if len(records) != 77:
              raise RuntimeError(
                  f"expected 77 E038 eligible records, got {len(records)}"
              )

          fold_map = {f["heldout_repo"]: f for f in folds}
          if set(fold_map) != set(EXPECTED):
              raise RuntimeError(f"unexpected fold set: {sorted(fold_map)}")
          for repo, spec in EXPECTED.items():
              fold = fold_map[repo]
              if fold["eligible_tasks"] != spec["eligible"]:
                  raise RuntimeError(f"{repo} eligible-count drift")
              if fold["eligible_source_files"] != spec["sources"]:
                  raise RuntimeError(f"{repo} eligible-source drift")

          function_n = sum(r["task"] == "function" for r in records)
          method_n = sum(r["task"] == "method" for r in records)
          if (function_n, method_n) != (38, 39):
              raise RuntimeError(
                  f"E038 task-family drift: {(function_n, method_n)} != (38, 39)"
              )

          memory = sum(r["memory"]["correct"] for r in records)
          ranked = sum(r["ranked"]["correct"] for r in records)
          both = sum(
              r["memory"]["correct"] and r["ranked"]["correct"]
              for r in records
          )
          ranked_only = sum(
              r["ranked"]["correct"] and not r["memory"]["correct"]
              for r in records
          )
          memory_only = sum(
              r["memory"]["correct"] and not r["ranked"]["correct"]
              for r in records
          )
          neither = len(records) - both - ranked_only - memory_only

          def two_sided_binomial(k, n):
              if n == 0:
                  return 1.0
              low = min(k, n - k)
              tail = sum(math.comb(n, i) for i in range(low + 1)) / (2 ** n)
              return min(1.0, 2.0 * tail)

          groups = defaultdict(lambda: defaultdict(list))
          for r in records:
              groups[r["repo"]][r["source"]].append(r)

          rng = random.Random(38038)
          boot = []
          for _ in range(5000):
              sample = []
              for repo in sorted(groups):
                  sources = sorted(groups[repo])
                  for _ in range(len(sources)):
                      source = rng.choice(sources)
                      sample.extend(groups[repo][source])
              delta = (
                  sum(r["ranked"]["correct"] for r in sample)
                  - sum(r["memory"]["correct"] for r in sample)
              ) / len(sample)
              boot.append(delta)

          def percentile(values, q):
              xs = sorted(values)
              pos = (len(xs) - 1) * q
              lo = int(math.floor(pos))
              hi = int(math.ceil(pos))
              if lo == hi:
                  return xs[lo]
              w = pos - lo
              return xs[lo] * (1 - w) + xs[hi] * w

          ci = [percentile(boot, 0.025), percentile(boot, 0.975)]
          p = two_sided_binomial(ranked_only, ranked_only + memory_only)
          delta = (ranked - memory) / len(records)

          by_task = {}
          for kind in ("function", "method"):
              rows = [r for r in records if r["task"] == kind]
              by_task[kind] = {
                  "n": len(rows),
                  "memory": sum(r["memory"]["correct"] for r in rows),
                  "ranked": sum(r["ranked"]["correct"] for r in rows),
                  "delta_points": 100.0 * (
                      sum(r["ranked"]["correct"] for r in rows)
                      - sum(r["memory"]["correct"] for r in rows)
                  ) / len(rows),
                  "next_feasible_correct": sum(
                      r["next_feasible_correct"] for r in rows
                  ),
                  "ranked_followed_next_recommendation": sum(
                      r["ranked"]["followed_recommendation"] for r in rows
                  ),
                  "memory_parse_valid": sum(
                      r["memory"]["parse_valid"] for r in rows
                  ),
                  "ranked_parse_valid": sum(
                      r["ranked"]["parse_valid"] for r in rows
                  ),
              }

          gate = {
              "ranked_gt_memory": ranked > memory,
              "mcnemar_p_lt_0_05": p < 0.05,
              "bootstrap_lower_gt_zero": ci[0] > 0.0,
          }
          gate["passed"] = all(gate.values())

          report = {
              "protocol": "E038 conditional SmolLM2 transfer of E032/E035 ranked correction",
              "eligible_tasks": len(records),
              "eligible_source_files": sum(
                  len(sources) for sources in groups.values()
              ),
              "memory_successes": memory,
              "ranked_successes": ranked,
              "correction_delta_points": 100.0 * delta,
              "paired": {
                  "both": both,
                  "ranked_only": ranked_only,
                  "memory_only": memory_only,
                  "neither": neither,
                  "mcnemar_exact_two_sided_p": p,
              },
              "cluster_bootstrap_95ci": ci,
              "next_feasible_correct": sum(
                  r["next_feasible_correct"] for r in records
              ),
              "ranked_followed_next_recommendation": sum(
                  r["ranked"]["followed_recommendation"] for r in records
              ),
              "memory_parse_valid": sum(
                  r["memory"]["parse_valid"] for r in records
              ),
              "ranked_parse_valid": sum(
                  r["ranked"]["parse_valid"] for r in records
              ),
              "primary_gate": gate,
              "by_task": by_task,
              "folds": sorted(folds, key=lambda x: x["heldout_repo"]),
          }

          with open("/tmp/e038-aggregate.json", "w", encoding="utf-8") as handle:
              json.dump(
                  {"summary": report, "records": records},
                  handle,
                  indent=2,
                  sort_keys=True,
              )
          print("E038_AGGREGATE=" + json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: e038-aggregate
          path: /tmp/e038-aggregate.json
